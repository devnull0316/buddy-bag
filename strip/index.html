<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>バディのバッグ 帯</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* レイアウト：上から 状態バー / 情報札＋指示（戦闘中は舞台） / 2人のバッグと連結ベルト / ショップ / 控えと決定ボタン。全部を1画面に収める */
:root{
  color-scheme:dark;
  --ink:#16110d;        /* 地：夜の野営地の暗がり */
  --wood:#2a2019;       /* ショップの木の台 */
  --wood-hi:#3a2c22;
  --leather:#7a4b2c;    /* 背嚢の革 */
  --leather-dk:#4d2f1c;
  --stitch:#d2a46a;
  --parch:#ecdcb8;      /* 羊皮紙 */
  --parch-ink:#2b1d12;
  --brass:#e2b04f;      /* 真鍮：お金と決定 */
  --brass-dk:#9a7024;
  --text:#f3e9d8;
  --sub:#bfae95;
  --rare:#7fb3d9; --epic:#e2b04f;
  --cell:56px;
  --edge:#0d0a08;
  --bevel:inset 2px 2px 0 rgba(255,236,200,.10),inset -2px -2px 0 rgba(0,0,0,.38);
  --f-dot:"DotGothic16","Zen Kaku Gothic New",monospace;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);font-family:var(--f-body);overflow:hidden;overscroll-behavior:none}
body{user-select:none;-webkit-user-select:none;touch-action:manipulation}
img,.spr{image-rendering:pixelated;image-rendering:crisp-edges;-webkit-user-drag:none;user-drag:none}
.ware img,.ware span,.pk img{pointer-events:none}
#app{height:100%;max-width:440px;margin:0 auto;padding-block:6px 8px;padding-inline:16px;display:flex;flex-direction:column;gap:6px}
.dot{font-family:var(--f-dot);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

#hud{display:flex;align-items:center;gap:10px;height:30px;flex:none}
#hud .round{font-size:17px}
#hud .round small{font-size:12px;color:var(--sub)}
#hud .boss{font-size:11px;color:var(--ink);background:#cf4b3f;padding:1px 5px;margin-left:4px}
#hud .lives{display:flex;gap:3px;margin-left:auto}
#hud .lives img{width:16px;height:14px}
#hud .gold{display:flex;align-items:center;gap:5px;font-size:18px;color:var(--brass);min-width:58px;justify-content:flex-end}
#hud .gold i{width:12px;height:12px;background:var(--brass);box-shadow:inset -2px -2px 0 var(--brass-dk);display:inline-block}
#mute{background:none;border:0;padding:4px;width:30px;height:30px}
#bQuit{background:rgba(0,0,0,.25);border:1px solid var(--edge);color:var(--sub);font-family:var(--f-dot);font-size:13px;padding:2px 8px;height:26px;margin-left:auto}#bQuit+#mute{margin-left:0}
#mute img{width:20px;height:20px}

/* 上段：情報札（次の敵／装備の詳細／ショップの品の詳細）と指示 */
#top{flex:none;position:relative}
#info{display:flex;align-items:center;gap:10px;background:var(--wood);border:2px solid var(--edge);box-shadow:var(--bevel);padding:4px 8px;height:64px;overflow:hidden}
#info .pic{width:48px;height:48px;flex:none;display:flex;align-items:flex-end;justify-content:center}
#info .pic img{width:40px;height:40px}
#info .pic .buddy{position:static;animation-duration:var(--dur)}
#info .who{display:flex;flex-direction:column;min-width:0;flex:1;gap:1px}
#info .name{font-family:var(--f-dot);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#info .name small{color:var(--sub);font-size:12px;margin-left:6px}
#info .line{font-size:13px;font-family:var(--f-dot);color:var(--sub);line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#info .line b{color:var(--text);font-weight:700}
#info.item{background:var(--parch);color:var(--parch-ink);border-color:var(--parch-ink)}
#info.item .line{color:#4d3826}
#info.item .line b{color:#2b1d12}
#info .buy{flex:none;background:var(--brass);color:var(--parch-ink);border:2px solid var(--parch-ink);font-family:var(--f-dot);font-size:15px;padding:8px 10px;box-shadow:inset 0 -3px 0 var(--brass-dk)}
#info .buy:disabled{opacity:.45}
.detailbtn{display:flex;width:48px;height:48px;flex:none;border:0;background:none;color:inherit;padding:0;flex-direction:column;justify-content:center!important;gap:1px;cursor:pointer}
#info .detailbtn img,#pop .detailbtn img{width:32px;height:32px}
.detailbtn small{font-size:11px;line-height:1.1;text-decoration:underline;text-underline-offset:2px}
.itemdetail .heading{display:flex;align-items:center;gap:10px;margin-bottom:8px}.itemdetail .heading img{width:48px;height:48px}.itemdetail .heading h2{font-size:20px;margin:0!important}
.itemdetail .facts p{overflow-wrap:anywhere}.itemdetail .apt{display:inline-block;margin:3px 4px 0 0;font-size:12px}
.rar{font-family:var(--f-dot);font-size:11px;padding:0 4px;margin-left:6px;color:var(--parch-ink)}
.rar1{background:#cbb894}.rar2{background:var(--rare)}.rar3{background:var(--epic)}
.kw{font-family:var(--f-dot);padding:0 3px;color:#fff;font-size:12px}
.kw.burn{background:#c9542a}.kw.poison{background:#5f8f2e}.kw.freeze{background:#3d86b8}.kw.crit{background:#a0469a}.kw.bleed{background:#9b1d2a}
.apt{font-family:var(--f-dot);font-size:11px;padding:0 3px;margin-left:3px;color:#fff}
.chip{color:#fff;font-family:var(--f-dot);padding:0 4px;font-size:11px;margin-right:2px}
#guide{margin-top:6px;background:linear-gradient(var(--parch-ink) 0 2px,#f3e6c4 2px 4px,var(--parch) 4px calc(100% - 4px),#c9b48a calc(100% - 4px) calc(100% - 2px),var(--parch-ink) calc(100% - 2px));color:var(--parch-ink);font-family:var(--f-dot);font-size:14px;padding:5px 22px;height:32px;display:flex;align-items:center;justify-content:center;text-align:center;gap:8px;overflow:hidden;line-height:1.3;clip-path:polygon(0 0,100% 0,calc(100% - 10px) 50%,100% 100%,0 100%,10px 50%)}
#guide .gtx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;text-align:center}#guide .rtbtn{flex:none;display:flex;align-items:center;gap:3px;font-family:var(--f-dot);font-size:12px;background:var(--wood);color:var(--text);border:2px solid var(--brass);padding:1px 6px;line-height:1.1;flex-direction:row}#guide .rtbtn img{width:16px;height:16px;image-rendering:pixelated}#guide .rtbtn small{font-size:9px;color:var(--sub);margin-left:2px}
#battleBar .btn{font-size:13px}#battleBar .rally{background:#2f4f7a;color:#e8f0ff;border-color:#16253a;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;padding:4px}#battleBar .rally small{font-size:10px;opacity:.9}#battleBar .rally:disabled{opacity:.45}#battleBar #bAssault{background:#754027;border-color:#422315}#battleBar .rally[hidden]{display:none}
.cell.parcel{opacity:1;background:#665039;border:2px solid var(--brass);display:flex;align-items:center;justify-content:center;text-align:center;color:#fff0c8;font-size:11px;line-height:1.25;cursor:pointer}.cell.parcel span{pointer-events:none}
#battleBar:has(#bAssault:not([hidden])) #bSpeed,#battleBar:has(#bAssault:not([hidden])) #bSkip{flex:0 0 49px;padding:2px;font-size:12px}#battleBar .rally{min-width:0;white-space:nowrap}#battleBar .rally small{white-space:normal}
.facts{margin:6px 0;padding:5px 8px;border:1px solid var(--edge);background:rgba(0,0,0,.18);text-align:left}.facts p{margin:2px 0;font-size:13px;line-height:1.45}.facts b{color:#ffe07a;font-weight:400}.facts .sub{font-size:11px}
.hint2{background:rgba(224,96,58,.12);border:1px solid #6a3020;padding:5px 8px;font-size:13px;line-height:1.5}.hint2 b{color:#ffd8a0;font-weight:400}.hint2 small{color:var(--sub)}
#hInt{font-size:11px;color:#c9b48a;margin-left:2px;align-self:flex-end;margin-bottom:2px}
#hRound .mlab{background:#5a4320;color:#ffd34a;padding:0 4px;margin-right:4px;font-size:12px}
#guide b{color:#a33a10;font-weight:400}
#stage{display:none;position:relative;background:#1c1612;border:2px solid var(--edge);overflow:hidden}
#stage canvas{display:block;width:100%;height:100%}

#mcard .relicrow.talentrow{display:block;padding:6px 8px}#mcard .talentrow>p{margin:0 0 4px}#mcard .talentrow .row2{gap:6px;margin:0}#mcard .btn.talentpick{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:left;height:auto;min-height:58px;padding:6px 8px}
#mcard .talentpick b{font-size:13px}#mcard .talentpick small{font-size:11px;line-height:1.35;opacity:.9;white-space:normal}
.newdot{color:#e06a4a;font-size:10px;margin-left:3px;vertical-align:top}



/* 寄り道ステージ（r66） */
.ch.side{border-style:dashed;opacity:.95}.ch.side .cn{color:#9fd08a}
/* 上のバッグの名札が、上の案内の帯に重ならないように */
#board .bag[data-u="0"]{margin-top:10px}
/* 系統とレシピの帯（r66w） */
.setstrip{position:relative;z-index:4;display:block;width:100%;margin:2px 0;padding:2px 8px;min-height:22px;font-size:11px;line-height:1.3;text-align:left;background:#211c15;border:1px solid #5a4c35;color:#d9caa6;font-family:var(--f-dot)}
.setstrip .setc{margin-right:4px;opacity:.7}.setstrip .setc.on{opacity:1;color:#ffd77a}.setstrip small{opacity:.7}.setstrip .recipeon{color:#ffd77a}
.recipebook .recipe{display:flex;flex-direction:column;gap:1px;padding:4px 0;border-bottom:1px solid #3a3226;font-size:12px}.recipebook img{width:18px;height:18px;image-rendering:pixelated;vertical-align:middle}
.recipego{width:100%;margin:3px 0;min-height:44px}
/* 遺物の枠（r65b） */
.vessels{display:flex;flex-direction:column;gap:6px;margin:6px 0}.vhero{display:flex;align-items:center;gap:6px;background:#282d2b;border:2px solid #79694c;padding:4px 6px}
.vname{display:flex;flex-direction:column;align-items:center;width:52px;flex:none;font-size:11px}.vname b{font-size:12px}.vslots{display:flex;gap:4px;flex:1}
.vslot{width:40px;height:40px;flex:none;border:3px solid;background:#1d1a16;display:flex;align-items:center;justify-content:center;padding:0;font-size:10px;color:#cdbf9f}
.vslot img{width:30px;height:30px;image-rendering:pixelated}.vslot.locked{opacity:.45}.vslot.on{outline:2px solid #fff3c4;outline-offset:1px}
.vlist{display:flex;flex-direction:column;gap:4px;max-height:none}.vitem{display:flex;gap:6px;align-items:center;text-align:left;background:#282d2b;border:2px solid #4b4231;border-left:6px solid;padding:4px 6px;color:inherit;font:inherit}
.vitem img{width:30px;height:30px;image-rendering:pixelated;flex:none}.vitem span{display:flex;flex-direction:column}.vitem b{font-size:13px}.vitem small{font-size:11px;line-height:1.35}.vwhere{color:#9fd08a}
.vitem small.rk1,.vitem small.rk2,.vitem small.rk3{font-size:10px;padding:0 4px;color:#2a1d10;display:inline}.rk1{background:#c48a5a}.rk2{background:#c9ced6}.rk3{background:#ffd77a}
.vitem>span>small:first-of-type{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vfilter .btn{white-space:nowrap;padding:0 2px;min-height:36px;font-size:13px}.vspots{display:flex;flex-wrap:wrap;gap:4px}.vspots .btn{flex:1 1 45%;min-height:40px;font-size:13px}
.rlxdrop{background:#2a241b;border:2px solid #e0b04a;padding:6px;margin:6px 0}.rlxcands{display:flex;gap:4px;margin:4px 0}.rlxcard{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:#1d1a16;border:3px solid;padding:4px;color:inherit;font:inherit;font-size:11px;line-height:1.3;text-align:center}
.rlxcard img{width:32px;height:32px;image-rendering:pixelated}.rlxcard b{font-size:12px}

/* 遺物の三択の見た目（色ごとにほんのり光る・大は金の縁） */
.rlxdrop{background:linear-gradient(#2c251b,#221c15);border:2px solid #e0b04a;padding:8px;margin:8px 0;box-shadow:0 0 0 3px #1a140e}
.rlxttl{display:block;font-size:15px;color:#ffe2a0;letter-spacing:.05em}
.rlxcands{display:flex;gap:6px;margin:6px 0}
.rlxcard{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border:3px solid;color:inherit;font:inherit;font-size:11px;line-height:1.3;text-align:center;position:relative;min-width:0}
.rlxcard.rc-r{border-color:#d0563e;background:radial-gradient(circle at 50% 28%,rgba(208,86,62,.45),#1d1714 62%)}
.rlxcard.rc-b{border-color:#4f8fd8;background:radial-gradient(circle at 50% 28%,rgba(79,143,216,.45),#15181d 62%)}
.rlxcard.rc-y{border-color:#d7b13c;background:radial-gradient(circle at 50% 28%,rgba(215,177,60,.45),#1d1a12 62%)}
.rlxcard.rz-3{box-shadow:0 0 0 2px #ffd77a,0 0 12px rgba(255,215,122,.55)}
.rlxcard.rz-3::before{content:'秘宝';position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:#ffd77a;color:#2a1d10;font-size:10px;padding:0 6px;font-weight:700}
.rlxgem{width:52px;height:52px;display:flex;align-items:center;justify-content:center}
.rlxgem img{width:48px;height:48px;image-rendering:pixelated;filter:drop-shadow(0 0 4px rgba(255,255,255,.25))}
.rlxcard b{font-size:13px;color:#fff3d6}.rlxpips{font-size:10px;color:#e8d29a;letter-spacing:.05em}
.rlxeffs{display:flex;flex-direction:column;gap:2px;width:100%;margin-top:2px}
.rlxeff{background:rgba(0,0,0,.35);border-left:2px solid currentColor;padding:2px 4px;font-size:11px;text-align:left;color:#f0e4c6}
.rc-r .rlxeff{border-left-color:#d0563e}.rc-b .rlxeff{border-left-color:#4f8fd8}.rc-y .rlxeff{border-left-color:#d7b13c}
.vslot{box-shadow:inset 0 0 8px rgba(0,0,0,.6)}.vslot img{filter:drop-shadow(0 0 3px rgba(255,255,255,.3))}
/* 遺物の発動表示 */
#relicFx{position:absolute;left:6px;bottom:6px;display:flex;flex-direction:column;gap:3px;z-index:6;pointer-events:none;width:min(310px,calc(100% - 12px));max-width:calc(100% - 12px)}
#board{position:relative}#board #relicFx{bottom:auto;top:4px}
.rfx{display:flex;align-items:center;gap:4px;background:rgba(20,14,10,.88);border:1px solid #e0b04a;padding:2px 6px 2px 2px;font-size:11px;line-height:1.2;color:#f3e3c0;overflow-wrap:anywhere}
.rfx img{width:22px;height:22px;flex:none;image-rendering:pixelated}.rfx>div{min-width:0;flex:1}.rfx b{font-weight:700;color:#e0b04a;margin-right:5px}.rfx span{white-space:normal}.rfx small{display:block;color:#d2c6b2;font-size:10px;line-height:1.3}


body.battle #setStrip{display:none!important}
body.battle #info,body.battle #guide{display:none}
body.battle #stage{display:block}

/* バッグ */
#board{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:2px}
.bag{position:relative;align-self:center;width:max-content;max-width:100%;margin-left:34px;background:var(--leather);padding:14px 8px 8px;border:2px solid var(--edge);box-shadow:inset 2px 2px 0 #9a6640,inset -2px -3px 0 var(--leather-dk)}
.bag::before{content:"";position:absolute;inset:5px;border:1px dashed var(--stitch);opacity:.3;pointer-events:none}
.bag .rv{position:absolute;width:6px;height:6px;background:var(--brass);box-shadow:inset -2px -2px 0 var(--brass-dk);z-index:1}
.bag .rv.a{top:3px;right:3px}.bag .rv.b{bottom:3px;left:3px}.bag .rv.c{bottom:3px;right:3px}
.bag .tag{position:absolute;left:8px;top:-11px;white-space:nowrap;display:flex;align-items:center;gap:5px;background:var(--parch);color:var(--parch-ink);padding:1px 7px;font-size:14px;font-family:var(--f-dot);border:2px solid var(--edge);z-index:2;line-height:1.3}
.bag .tag .el{color:#fff;padding:0 4px}
.buddy{flex:none;pointer-events:none;position:absolute;left:-40px;bottom:0;z-index:2;background-repeat:no-repeat;animation:sheet var(--dur,1s) steps(var(--n)) infinite}
@keyframes sheet{to{background-position:var(--end) 0}}
.grid{display:grid;grid-template-columns:repeat(4,var(--cell));grid-auto-rows:var(--cell);gap:4px;justify-content:center;position:relative}
.cell{position:relative;background:var(--leather-dk);box-shadow:inset 2px 2px 0 rgba(0,0,0,.4),inset -1px -1px 0 rgba(255,220,180,.08);display:flex;align-items:center;justify-content:center}
.cell.off{background:transparent;box-shadow:none;border:1px dashed rgba(210,164,106,.3)}
.cell img.it{width:calc(var(--cell) * .72);height:calc(var(--cell) * .72);pointer-events:none;position:relative;z-index:1}
.cell.r2{box-shadow:inset 0 3px 0 var(--rare),inset 2px 2px 0 rgba(0,0,0,.4)}
.cell.r3{box-shadow:inset 0 3px 0 var(--epic),inset 2px 2px 0 rgba(0,0,0,.4)}
.cell .star{position:absolute;top:1px;right:3px;font-family:var(--f-dot);font-size:11px;color:var(--brass);z-index:2;line-height:1}
.cell .bars{position:absolute;left:3px;right:3px;bottom:6px;display:flex;flex-direction:column;gap:2px;z-index:2}
.cell .bars i{display:block;height:3px;background:rgba(0,0,0,.5);position:relative}
.cell .bars i b{position:absolute;inset:0 auto 0 0;width:0}
.cell .src{position:absolute;left:1px;top:1px;display:flex;gap:1px;z-index:2}
.cell .src img{width:14px;height:14px;background:rgba(13,10,8,.75);box-shadow:0 0 0 1px #f7dc8a}
.cell .uses{position:absolute;left:0;right:0;bottom:0;height:4px;display:flex}
.cell .uses i{flex:1}
.cell.sel{outline:2px solid #fff;outline-offset:-2px}
.cell.can{background:#5e3a22;box-shadow:inset 0 0 0 2px var(--brass)}
.cell.can2{outline:1px solid rgba(226,176,79,.5);outline-offset:-1px}
.cell.syn{outline:3px solid #f7dc8a;outline-offset:-3px}
.cell.frozen::after{content:"";position:absolute;inset:0;background:rgba(150,210,255,.45);z-index:3}
.cell.warn{animation:warnb .25s steps(2,end) infinite}@keyframes warnb{50%{box-shadow:inset 0 0 0 3px #ff5040}}
.cell.sealed::after{content:"";position:absolute;inset:0;background:var(--lockimg) center/34% no-repeat,repeating-linear-gradient(45deg,rgba(40,20,60,.0) 0 6px,rgba(150,120,190,.55) 6px 8px),repeating-linear-gradient(-45deg,rgba(40,20,60,.0) 0 6px,rgba(150,120,190,.55) 6px 8px),rgba(30,18,40,.72);image-rendering:pixelated;display:flex;align-items:center;justify-content:center;font-family:var(--f-dot);font-size:18px;z-index:3}
.belt{position:relative;padding:15px 8px 3px;align-self:center;width:100%}
.belt .strap{position:absolute;left:0;right:0;top:calc(50% + 6px);height:18px;transform:translateY(-50%);background:repeating-linear-gradient(90deg,#5d3f27 0 10px,#6d4a2e 10px 20px);border-block:2px solid #3d2818}
.belt .label{position:absolute;left:50%;transform:translateX(-50%);top:-1px;white-space:nowrap;font-size:12.5px;color:var(--sub);z-index:2;background:var(--ink);padding:0 5px;line-height:1.4}
.belt .label b{color:var(--brass);font-weight:400}
.belt .grid{padding-left:34px}
.belt .cell{background:#2b2620;border:2px solid #4a4038}
.belt .cell.lock img{width:calc(var(--cell) * .45);height:calc(var(--cell) * .45);opacity:.6}
.belt .cell.open{border:2px solid var(--c1);border-bottom-color:var(--c2);border-right-color:var(--c2);background:#2a2219}
.belt .cell.open.can{background:#4a3a24}

/* ショップ */
#shop{flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;height:84px}
.ware{background:var(--wood);border:2px solid var(--edge);box-shadow:inset 0 2px 0 rgba(255,255,255,.05);padding:3px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.ware img{width:32px;height:32px}
.ware .nm{font-size:11px;font-family:var(--f-dot);line-height:1.1;white-space:normal;overflow-wrap:anywhere;max-width:100%;height:24.2px;display:flex;align-items:center;justify-content:center}

 while(box.children.length<limit&&RFX.queue.length){const x=RFX.queue.shift(),el=document.createElement('div');x.el=el;el.className='rfx';el.innerHTML='<img alt=""><div><b></b><span></span><small></small></div>';

function fxPop(key,icon,name,text,v=0,format=null,detail=''){if(SILENT)return;const now=performance.now(),cur=RFX.items.get(key);
 if(cur){if(now-cur.t<1200){cur.v+=v;if(cur.el)cur.el.querySelector('span').textContent=cur.format?cur.format(cur.v):text;cur.text=text;}return;}
 if(S.phase==='battle'&&S.speed>=4&&now-(RFX.seen.get(key)??-9999)<4400)return;

function showOperationHelp(back=closeModal){modal(`<h2>遊び方</h2><h3>まずはこれだけ</h3>${basicHelpHTML()}<h3 class="dict">困ったときに読む</h3><details><summary>敵の種族と相性・ボスの大技・精鋭と宝石<small class="when">どの品がよく効くか知りたいとき</small></summary><div class="ophelp"><p>敵には「骨」「飛ぶ」「獣」などの種族があります。次の敵の札に、効きやすい系統（◎）と効きにくい系統（△）が出ます。◎の装備は1.4倍、△の装備は0.8倍の威力です。バッグとお店の品にも、次の敵に対して◎か△の印が付きます。</p><p>${Object.values(RACE68).map(r=>`<b>${r.nm}</b> ◎${CLSN[r.weak]} △${CLSN[r.res]}`).join('　')}</p><p>ボスは大技を使います。敵の上のゲージが大技までの時間です。もうすぐになったら、号令「守りを固めよ」で受けよう。</p><p><b>連鎖</b>：「充填」は装備の待ち時間を進めて、早く使わせる。「加速」はしばらく2倍の速さで動かす。ぜんまい・伝令の角笛・火種・鳴子・歯車の盾・雷の鎖で、置く場所によって連鎖の形が変わる。</p><p><b>精鋭と宝石</b>：物語の章では1回だけ、ボス以外の戦いを「精鋭」にできます（次の敵の札のボタン）。HP+20%・攻撃+15%になりますが、勝つと宝石を1つ選べます。宝石は炎・氷・毒の3種類。準備のあいだ、攻撃する装備にはめたり外したりできて、はめた装備にその相性が付きます。宝石はその出撃のあいだだけ使えます。</p></div></details><details><summary>系統・重ねがけ・覚醒<small class="when">同じなかまの品をそろえると強くなる</small></summary><div class="ophelp"><p>装備には「刃」「毒」「守り」などの系統があります。2人のバッグとベルトに同じ系統が2・4・6個あると、その系統の装備が強くなります。</p><p>力（武器のダメージ+1/重ね）・熱（装備が2%速い/重ね）・再生（2秒ごとに回復）は味方に、脆弱（受けるダメージ+3%/重ね）・弱体（攻撃-3%/重ね）は敵に重なります。</p><p>決まった品を隣り合わせると、伝説の品を作れます（準備画面の「系統」の帯から）。</p></div></details><details><summary>ベルト・必殺技・号令<small class="when">2人で使う枠と、戦いの中のボタン</small></summary><div class="ophelp"><p>ベルトの装備は2人が同時に使います。</p><p>必殺技はゲージがたまると自動で発動。</p><p>号令は戦闘中に押して使います。効き目が切れてから15秒たつと、もう一度使えます。</p></div>${specialHelpHTML()}</details><details><summary>錬成<small class="when">武器2つを1つにまとめる</small></summary><div class="ophelp"><p>金床を選び、「錬成」を押します。</p><p>違う武器2つを、同じ★でそろえよう。</p><p>武器が1つになり、金床はなくなります。</p></div></details><details><summary>店と探す品<small class="when">ほしい品を探したいとき</small></summary>${shopHelpHTML()}<p class="sub">「目印」は探す品を覚えておく機能です。品ぞろえは変わりません。</p>${S.phase==='plan'?'<div class="row2"><button class="btn" id="bShopSearch">探す品の目印を設定</button></div>':''}</details><details><summary>報酬・勇者の訓練<small class="when">勇者のレベルの上げ方</small></summary>${samePairHelpHTML()}${rewardSpaceHelpHTML()}${dropHelpHTML()}${levelHelpHTML()}${talentHelp65()}<p class="sub">ゴールドは今回の出撃の買い物に使います。報奨金は出撃後も残り、訓練に使えます。勝利と章クリアで報奨金を獲得します。残ったゴールドは報奨金にはなりません。遅れた勇者は、主力2人の低い方より3Lv下まで訓練費用が半額です。</p></details><details><summary>遺物・遺物の棚<small class="when">ずっと効く特別な品</small></summary>${relicShelfHelpHTML()}${relicHelp51HTML()}${relicPickHelpHTML()}${relicSwapHelpHTML()}${relicCollectionHelp63()}${relicGrowthHelp65()}<p>「組み方」は、合う装備や置き方のヒントです。代償のある遺物は、効果が下がる所も確認しましょう。金の勝利印までの記録は、使ってクリアした章ごとに残ります。</p><p>第1章クリア後に使えます。枠ははじめ1個、第4章と第8章のクリアで1個ずつ増えます。途中の選択は第1戦と中間の戦いの勝利後。満杯なら、持ち込み・途中で得た遺物のどちらとも入れ替えられます。</p></details><details><summary>第13章からの作戦・吹雪${helpFar68(13)}</summary>${operationHelpHTML()}${snowHelpHTML()}<p class="sub">止まる順は上のバッグの下段 → 下のバッグの上段 → ベルト。1秒前に段を囲みます。</p></details><details><summary>第14章からの構え崩し・防衛${helpFar68(14)}</summary>${northernHelpHTML('stance')}${northernHelpHTML('defend')}</details><details><summary>戦功・追加の挑戦</summary>${honorHelpHTML()}<p class="sub">第13章の初クリアで開放。以後、第1戦後に「通常」「少ない援助」「強い支援」から一つ選べます。拠点を決めると、その出撃では固定です。</p></details><div class="row2"><button class="btn go" id="opHelpBack">もどる</button></div>`);$m('#opHelpBack').onclick=back;if($m('#bShopSearch'))$m('#bShopSearch').onclick=()=>showShopSearch(()=>showOperationHelp(back));}

function storyScene(kind,r){const ch=S.run&&S.run.ch||S.storyCh||1;const h=S.heroes||[];
  if(isSide(ch)){const c=CHAPTERS[ch];const L={intro:[['scout',`${c.nm}に魔物がいます！ 短い戦いです。報奨金も多めに出ます！`]],boss:[['scout',`${c.lead}です！ 少し手ごわいですよ！`]],mid:[['scout','もう少しです！']],clear:[['minister',`${c.nm}を片づけました。報奨金を受け取りましょう。`]],fail:[['minister','無理は禁物です。準備をし直しましょう。']]}[kind]||[];if(kind==='intro')return L;return[...L,...h.map(x=>[x,{knight:kind==='fail'?'次こそ勝つ！':'よし、片づいたな！',mage:kind==='fail'?'出直しじゃのう':'ほっほ、寄り道も悪くないのう',archer:kind==='fail'?'装備を見直す':'終わった。戻ろう'}[x]])];}
  if(ch===1)return kind==='boss'||kind==='mid'?STORY.boss(S.enc[r].t):kind==='clear'?STORY.clear(h):kind==='fail'?STORY.fail(h):STORY.intro;
  const d=SC[ch][kind];if(kind==='intro')return d;return[...d.c,...h.map(x=>[x,d.h[x]])];}

function xferFileName(){const d=new Date();return 'buddybag-save-'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.txt';}
// 引き継ぎの読み込み：ファイルの中身・貼り付けたコードのどちらでも。進行は合わせ込み（減らない）
function applyTransfer(raw){raw=String(raw||'');const i=raw.indexOf('BB1:');if(i<0)throw 0;raw=raw.slice(i).split(/\s/)[0];const o=JSON.parse(decodeURIComponent(escape(atob(raw.slice(4)))));if(!o||!o.p)throw 0;
  saveProg(o.p);if(o.s&&!localStorage.getItem(SAVE_KEY))safeSet(SAVE_KEY,o.s);recordPlay('transfer_load',{});}
// ファイルに保存：Artifactの保存機能 → 共有シート → 通常のダウンロードの順に試す
async function saveTransferFile(){const code=transferCode(),fn=xferFileName(),msg=t=>{const m=$m('#xfMsg');if(m)m.textContent=t;};
  msg('保存の準備中…');
  // Artifactの保存機能は応答しない画面もあるので、3秒で見切る。確認が出ないまま待たせない
  const late=setTimeout(()=>msg('保存の確認が出ないときは、下の「コードで引き継ぐ」を使ってください。'),12000);
  try{const dl=window.claude&&claude.use?await Promise.race([claude.use('downloads'),new Promise(r=>setTimeout(()=>r(null),3000))]):null;if(dl){await dl.save({filename:fn,data:code});clearTimeout(late);msg('保存しました。');recordPlay('transfer_save',{via:'downloads'});return;}}catch(e){clearTimeout(late);if(e&&e.code==='declined'){msg('保存を取りやめました。');return;}}
  clearTimeout(late);
  try{const f=new File([code],fn,{type:'text/plain'});if(navigator.maxTouchPoints>0&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'バディのバッグのセーブデータ'});msg('保存しました。');recordPlay('transfer_save',{via:'share'});return;}}catch(e){if(e&&e.name==='AbortError'){msg('保存を取りやめました。');return;}}
  try{const url=URL.createObjectURL(new Blob([code],{type:'text/plain'})),a=document.createElement('a');a.href=url;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);msg('保存を始めました。');recordPlay('transfer_save',{via:'link'});}
  catch(e){msg('ファイルに保存できませんでした。下の「コードで引き継ぐ」を使ってください。');}}
