<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>王様の鞄 遠征記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --ink:#16110d;--wood:#2a2019;--wood-hi:#3a2c22;--leather:#7a4b2c;--leather-dk:#4d2f1c;--stitch:#d2a46a;
  --parch:#ecdcb8;--parch-ink:#2b1d12;--brass:#e2b04f;--brass-dk:#9a7024;--text:#f3e9d8;--sub:#bfae95;--edge:#0d0a08;
  --phys:#c9c2b4;--fire:#e8673c;--ice:#6fc3e8;--thun:#e8cf4a;
  --r1:#a99a86;--r2:#5fa6e0;--r3:#b77ee8;--r4:#e2b04f;--r5:#e8583c;
  --cell:min(76px,calc((100vw - 64px)/4));
  --bevel:inset 2px 2px 0 rgba(255,236,200,.10),inset -2px -2px 0 rgba(0,0,0,.38);
  --f-dot:"DotGothic16","Zen Kaku Gothic New",monospace;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);font-family:var(--f-body);overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;touch-action:manipulation}
.dot{font-family:var(--f-dot);font-variant-numeric:tabular-nums}
#app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative}
#top{flex:none;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--wood);border-bottom:2px solid var(--edge);font-family:var(--f-dot);font-size:14px;padding-top:max(6px,env(safe-area-inset-top))}
#top .lv{background:#3a2c22;padding:1px 6px;border:1px solid var(--edge)}
#top .xpbar{width:64px;height:6px;background:#0d0a08;position:relative}#top .xpbar i{position:absolute;inset:0 auto 0 0;background:#7fc06a}
#top .gold{color:var(--brass);margin-left:auto}
#top .ib{background:rgba(0,0,0,.25);border:1px solid var(--edge);padding:2px 8px;min-height:28px;font-family:var(--f-dot);font-size:13px;color:var(--sub)}
#stagewrap{flex:none;position:relative;height:clamp(118px,17dvh,150px);background:#120e14;border-top:3px solid #120b08;box-shadow:0 -2px 0 #5a2f22}
#stage{width:100%;height:100%;display:block;image-rendering:pixelated}
#hud{position:absolute;left:6px;right:6px;top:4px;display:flex;gap:6px;align-items:center;font-family:var(--f-dot);font-size:13px;pointer-events:none}
#hud .pill{background:rgba(13,10,8,.72);padding:1px 7px;border:1px solid rgba(0,0,0,.6)}
#hud .btns{margin-left:auto;display:flex;gap:4px;pointer-events:auto}
#hud .btns button{background:rgba(13,10,8,.78);border:1px solid #4a3a2a;font-family:var(--f-dot);font-size:13px;min-width:38px;min-height:30px;padding:0 6px}
#hud .btns button.on{border-color:var(--brass);color:var(--brass)}
#feed{position:absolute;left:0;right:0;bottom:calc(100% + 6px);display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none;z-index:5}
#feed .t{display:flex;align-items:center;gap:6px;background:rgba(13,10,8,.88);font-family:var(--f-dot);font-size:13px;padding:2px 10px 2px 4px;border:1px solid #000;box-shadow:0 0 0 1px #5a2f22;animation:tl 3s forwards}
#feed .t img{width:22px;height:22px;image-rendering:pixelated}
#feed .t .k{color:var(--sub)}
@keyframes tl{0%{opacity:0;transform:translateY(4px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:8px 10px 12px}
#tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--wood);border-top:2px solid var(--edge);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{background:none;border:0;border-right:1px solid var(--edge);padding:8px 0 7px;font-family:var(--f-dot);font-size:14px;color:var(--sub);position:relative;min-height:46px}
#tabs button.on{color:var(--text);background:var(--wood-hi);box-shadow:inset 0 3px 0 var(--brass)}
#tabs .badge{position:absolute;top:5px;right:calc(50% - 26px);width:8px;height:8px;background:#e8583c;border:1px solid #000}
.card{background:var(--wood);border:2px solid var(--edge);box-shadow:var(--bevel);padding:8px 10px;margin-bottom:8px}
.card h3{margin:0 0 4px;font-family:var(--f-dot);font-weight:normal;font-size:15px}
.sub{color:var(--sub);font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.btn{background:#3a2c22;border:2px solid var(--edge);box-shadow:var(--bevel);font-family:var(--f-dot);font-size:15px;padding:8px 12px;min-height:44px}
.btn:disabled{opacity:.45}
.btn.go{background:var(--brass);color:var(--parch-ink);box-shadow:inset 0 -3px 0 var(--brass-dk);flex:1}
.btn.sm{font-size:13px;padding:4px 8px;min-height:34px}
.el{display:inline-block;font-family:var(--f-dot);font-size:12px;padding:0 4px;color:#1a120c;margin-right:2px;line-height:1.5}
.el.phys{background:var(--phys)}.el.fire{background:var(--fire)}.el.ice{background:var(--ice)}.el.thun{background:var(--thun)}
.mk{font-family:var(--f-dot);font-size:12px;margin-left:1px}
.mk.good{color:#8fe07a}.mk.bad{color:#ff7a5a}.mk.mid{color:var(--sub)}
/* 次の面 */
#next .foes{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
#next .foe{display:flex;align-items:center;gap:4px;background:#1f1812;padding:2px 6px 2px 2px;border:1px solid var(--edge);font-size:13px}
#next .foe img{width:28px;height:28px;object-fit:contain;image-rendering:pixelated}
#next .eff{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;font-family:var(--f-dot);font-size:13px}
#next .tagx,.mini .tagx{font-family:var(--f-dot);font-size:12px;padding:0 5px;margin-left:4px}
.tag-strong{background:#b4442e;color:#fff}.tag-boss{background:#7a2a8a;color:#fff}.tag-bad{background:#2e5a8a;color:#fff}
/* 鞄 */
#bagwrap{position:relative;display:flex;flex-direction:column;align-items:center;margin:6px 0}
#bag{display:grid;grid-template-columns:repeat(4,var(--cell));grid-template-rows:repeat(3,var(--cell));gap:4px;padding:8px;background:var(--leather);border:3px solid var(--edge);box-shadow:inset 0 0 0 2px var(--stitch),var(--bevel);position:relative}
#bag .cell{position:relative;background:var(--leather-dk);box-shadow:inset 2px 2px 0 rgba(0,0,0,.4),inset -1px -1px 0 rgba(255,220,180,.08);display:flex;align-items:center;justify-content:center;touch-action:none}
#bag .cell.tgt{outline:2px dashed var(--brass);outline-offset:-3px}
#bag .cell.sel{outline:3px solid #fff;outline-offset:-3px;z-index:2}
#bag .cell.adj{box-shadow:inset 0 0 0 3px rgba(226,176,79,.55)}
#bag .cell .cdb{position:absolute;left:3px;bottom:3px;height:3px;width:0;max-width:calc(100% - 6px);background:#e2b04f;box-shadow:0 0 0 1px #000;pointer-events:none}
#bag .cell.fire{box-shadow:inset 0 0 0 3px #ffe9a8,inset 0 0 14px rgba(255,220,140,.55)}
#bag .cell.seal::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(80,40,120,.55) 0 6px,rgba(30,10,50,.55) 6px 12px)}
.it{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.it img{width:78%;height:78%;object-fit:contain;image-rendering:pixelated;pointer-events:none}
.it .st{position:absolute;left:2px;top:1px;font-family:var(--f-dot);font-size:11px;color:#ffe9a8;text-shadow:1px 1px 0 #000}
.it .own{position:absolute;right:1px;bottom:1px;width:20px;height:20px;border:1px solid #000;background:#1a120c;overflow:hidden}
.it .own img{width:100%;height:100%;object-fit:cover;object-position:top}
.it .elb{position:absolute;left:2px;bottom:2px;width:8px;height:8px;border:1px solid #000}
.it.r1{box-shadow:inset 0 0 0 2px var(--r1)}.it.r2{box-shadow:inset 0 0 0 2px var(--r2)}.it.r3{box-shadow:inset 0 0 0 2px var(--r3)}.it.r4{box-shadow:inset 0 0 0 2px var(--r4)}.it.r5{box-shadow:inset 0 0 0 2px var(--r5)}
.it.off img{opacity:.35}
.it .num{position:absolute;right:2px;top:1px;font-family:var(--f-dot);font-size:11px;color:#fff;text-shadow:1px 1px 0 #000}
#bagnote{font-family:var(--f-dot);font-size:12px;color:var(--brass);height:16px;margin-top:2px}
/* 選んだ品の説明 */
#info{min-height:64px}
#info .nm{font-family:var(--f-dot);font-size:15px}
#info .line{font-size:13px;color:var(--sub);line-height:1.45;margin-top:2px}
#info .owners{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
#info .owners button{display:flex;align-items:center;gap:4px;background:#1f1812;border:2px solid var(--edge);padding:2px 6px;font-size:12px;min-height:34px}
#info .owners button.on{border-color:var(--brass)}
#info .owners img{width:22px;height:22px;object-fit:cover;object-position:top;image-rendering:pixelated}
/* 隊列 */
#party{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#party .pm{background:#1f1812;border:2px solid var(--edge);padding:4px;display:flex;gap:6px;align-items:center;min-height:52px}
#party .pm img{width:36px;height:36px;object-fit:cover;object-position:top;image-rendering:pixelated;background:#120e0b}
#party .pm .pos{font-family:var(--f-dot);font-size:11px;color:var(--sub)}
#party .pm .nm{font-family:var(--f-dot);font-size:13px}
/* 倉庫の帯 */
#strip{display:flex;gap:4px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:thin}
#strip .sitem{flex:none;width:58px;height:58px;background:#1f1812;border:2px solid var(--edge);position:relative}
#strip .sitem.sel{border-color:#fff}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0}
.chips button{background:#1f1812;border:1px solid var(--edge);font-family:var(--f-dot);font-size:13px;padding:3px 9px;min-height:32px;color:var(--sub)}
.chips button.on{color:var(--text);border-color:var(--brass)}
/* 倉庫の一覧 */
.list .li{display:flex;align-items:center;gap:8px;padding:5px 6px;background:#1f1812;border:1px solid var(--edge);margin-bottom:4px;min-height:52px}
.list .li .ic{width:44px;height:44px;flex:none}
.list .li .tx{flex:1;min-width:0}
.list .li .tx b{font-family:var(--f-dot);font-weight:normal;font-size:14px}
.list .li .tx small{display:block;color:var(--sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.newdot{display:inline-block;background:#e8583c;color:#fff;font-family:var(--f-dot);font-size:10px;padding:0 3px;margin-left:4px}
/* 地図 */
#map .rtabs{display:flex;gap:4px;margin-bottom:6px}
#map .rtabs button{flex:1;background:#1f1812;border:2px solid var(--edge);font-family:var(--f-dot);font-size:14px;padding:6px 0;min-height:42px;color:var(--sub)}
#map .rtabs button.on{color:var(--text);border-color:var(--brass)}
#map .rtabs button:disabled{opacity:.4}
#mapc{position:relative;width:100%;aspect-ratio:1/1.05;background:#2b2118;border:3px solid var(--edge);overflow:hidden;background-size:cover;background-position:center;image-rendering:pixelated}
#mapc svg{position:absolute;inset:0;width:100%;height:100%}
#mapc .pt{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid #1a120c;background:#6b5844;font-family:var(--f-dot);font-size:14px;display:flex;align-items:center;justify-content:center;color:#fff;text-shadow:1px 1px 0 #000}
#mapc .pt.done{background:#4f7a3a}#mapc .pt.open{background:var(--brass);color:var(--parch-ink);text-shadow:none}#mapc .pt.lock{background:#3a3028;color:#776}
#mapc .pt.cur{box-shadow:0 0 0 3px #fff}
#mapc .pt .m{position:absolute;top:-10px;right:-10px;font-size:10px;padding:0 3px;border:1px solid #000}
/* 窓 */
#modal{position:fixed;inset:0;background:rgba(5,3,2,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
#modal.on{display:flex}
#mcard{width:100%;max-width:440px;max-height:88dvh;overflow-y:auto;background:var(--parch);color:var(--parch-ink);border:3px solid var(--edge);box-shadow:inset 0 0 0 2px #c9b48a;padding:14px}
#mcard h2{margin:0 0 8px;font-family:var(--f-dot);font-weight:normal;font-size:19px}
#mcard .btn{background:#e6d2a6;color:var(--parch-ink);box-shadow:inset 0 -3px 0 #b39867}
#mcard .btn.go{background:var(--brass)}
#mcard .sub{color:#6a5236}
#mcard .gain{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:4px;margin:6px 0}
#mcard .gain .g{background:#d9c497;border:1px solid #8a7048;height:52px;position:relative}
.why{background:#f5ead0;border-left:4px solid #b4442e;padding:6px 8px;margin:6px 0;font-size:14px}
.skl .sk{display:flex;align-items:center;gap:8px;padding:6px;background:#1f1812;border:1px solid var(--edge);margin-bottom:4px}
.skl .sk .tx{flex:1}.skl .sk b{font-family:var(--f-dot);font-weight:normal}
.skl .pips{font-family:var(--f-dot);font-size:12px;color:var(--brass)}
.jobs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.jobs .jb{background:#1f1812;border:2px solid var(--edge);padding:6px 4px;text-align:center;min-height:96px}
.jobs .jb.in{border-color:var(--brass)}.jobs .jb.sel{box-shadow:0 0 0 2px #fff}
.jobs .jb img{width:48px;height:48px;object-fit:cover;object-position:top;image-rendering:pixelated}
.jobs .jb b{display:block;font-family:var(--f-dot);font-weight:normal;font-size:14px}
.jobs .jb small{font-size:11px;color:var(--sub)}
.credit{font-size:11px;color:var(--sub);margin-top:10px;line-height:1.5}
.fly{position:fixed;pointer-events:none;z-index:60;font-family:var(--f-dot);font-size:14px;text-shadow:1px 1px 0 #000;animation:fly .8s ease-out forwards}
@keyframes fly{to{transform:translateY(-28px);opacity:0}}
@media (prefers-reduced-motion: reduce){.fly,#feed .t{animation-duration:.01s}}
/* タスクバーヒーロー風の窓 */
#main{background:#140d0a}
.win{position:relative;background:#2a1c16;border:3px solid #120b08;box-shadow:inset 0 0 0 2px #6a3324,inset 0 0 0 4px #1c120d,0 2px 0 #000;padding:22px 8px 8px;margin:14px 0 10px}
.win>.wt{position:absolute;left:50%;top:-12px;transform:translateX(-50%);background:linear-gradient(#8a3428,#5a1f1a);border:2px solid #120b08;box-shadow:inset 0 1px 0 #c0604a,0 0 0 1px #6a3324;font-family:var(--f-dot);font-size:15px;padding:2px 22px;white-space:nowrap;color:#f7e6c8;text-shadow:1px 1px 0 #000}
.win>.wt small{font-size:11px;color:#e8c8a8;margin-left:6px}
.slot{background:#1a120e;border:1px solid #0c0806;box-shadow:inset 2px 2px 0 #0c0806,inset -1px -1px 0 #3a2a20;position:relative}
#sgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
#sgrid .slot{aspect-ratio:1}
#sgrid .slot.sel{outline:2px solid #fff;outline-offset:-2px}
#sgrid .slot .num{position:absolute;right:2px;bottom:1px;font-family:var(--f-dot);font-size:11px;color:#fff;text-shadow:1px 1px 0 #000}
#sgrid .slot .newdot{position:absolute;left:0;top:0;margin:0}
.mini{display:flex;gap:6px;align-items:center;font-family:var(--f-dot);font-size:13px;flex-wrap:wrap}
.mini .foe{display:inline-flex;align-items:center;gap:2px;background:#1a120e;border:1px solid #0c0806;padding:1px 4px 1px 1px}
.note{background:#3a221a;border:2px solid #120b08;box-shadow:inset 0 0 0 1px #8a4a32;padding:6px 8px;margin-bottom:8px;font-size:13px;line-height:1.5}
.note b{font-family:var(--f-dot);font-weight:normal;font-size:14px;color:#ffd9a0}
.note .x{float:right;background:none;border:0;color:var(--sub);font-family:var(--f-dot);min-height:28px}
#tabs button img,#tabs button .tic{display:block;margin:0 auto 1px;width:22px;height:22px;image-rendering:pixelated}
#tabs button{padding:4px 0 5px;font-size:12px}
#hud .go{pointer-events:auto;position:absolute;left:50%;top:50%;transform:translate(-50%,-30%);background:var(--brass);color:var(--parch-ink);border:2px solid #000;box-shadow:inset 0 -3px 0 var(--brass-dk);font-family:var(--f-dot);font-size:17px;padding:8px 26px}
#party .pm{min-height:44px;padding:3px}
#party .hpb{height:5px;background:#0d0a08;margin-top:2px;position:relative}#party .hpb i{position:absolute;inset:0 auto 0 0;background:#7fc06a}#party .hpb u{position:absolute;inset:0 auto 0 0;background:#7fc3ff;opacity:.7}
</style>
</head>
<body>

  <div id="top"></div>
  <div id="main"></div>

</div>
<div id="modal"><div id="mcard"></div></div>

// 鞄を戦闘用の一覧にする。bag は品の配列、party は職業の並び
function compileBag(bag,party){
  const out=[];
  bag.forEach((it,i)=>{if(!it)return;const D=ITEMS[it.id];if(D.kind==='sup')return;
    const own=it.own,hi=party.indexOf(own);
    const o={slot:i,id:it.id,st:it.st,own,hi,kind:D.kind,cls:D.cls,el:D.el||'phys',D,p:D.p*STAR_MULT[it.st],cd:D.cd,mult:1,notes:[],echo:0};
    if(hi<0){o.off=1;out.push(o);return;}
    const aff=affOf(own,D.cls);o.mult*=AFF[aff];o.aff=aff;
    let empty=0,any=0;
    for(const n of nb(i)){const b=bag[n];if(!b){empty++;continue;}any++;const B=ITEMS[b.id];if(B.kind!=='sup')continue;
      if(B.sup==='pow'&&D.kind==='atk'){const v=supV(B.v,b.st);o.mult*=1+v;o.notes.push(`${B.nm}+${Math.round(v*100)}%`);}
      if(B.sup==='spd'&&D.kind==='atk'){const v=supV(B.v,b.st);o.cd/=1+v;o.notes.push(`${B.nm}で速い`);}
      if(B.sup==='care'&&(D.kind==='shield'||D.kind==='heal')){const v=supV(B.v,b.st);o.mult*=1+v;o.notes.push(`${B.nm}+${Math.round(v*100)}%`);}
      if(B.sup==='el'&&D.kind==='atk'&&D.el==='phys'){if(!o.stone||b.st>o.stone.st)o.stone={el:B.el,st:b.st,nm:B.nm};}
      if(B.sup==='echo')o.echo=1;}
    if(o.stone){o.el=o.stone.el;o.mult*=1.05+0.05*o.stone.st;o.notes.push(`${o.stone.nm}で${EL_NM[o.el]}`);}
    if(D.open&&empty>0){o.mult*=1.4;o.notes.push('空きで+40%');}
    if(D.alone&&any===0){o.mult*=2;o.notes.push('ひとりで2倍');}
    // 技
    const sk=id=>skRank(own,id);
    if(D.cls==='blade')o.mult*=1+sk('k_blade')*0.06;
    if(D.cls==='bow'){o.mult*=1+sk('a_dmg')*0.06;o.cd*=1-sk('a_spd')*0.03;}
    if(D.cls==='axe')o.mult*=1+sk('b_axe')*0.06;
    if(D.cls==='trap')o.mult*=1+sk('h_trap')*0.06;
    if(D.cls==='holy'&&D.kind==='atk')o.mult*=1+sk('p_holy')*0.06;
    if(D.kind==='atk'&&o.el!=='phys'&&own==='mage')o.mult*=1.15+sk('m_el')*0.06;
    if(D.kind==='shield')o.mult*=1+sk('k_guard')*0.08;
    if(D.kind==='heal'&&own==='priest')o.mult*=1.2+sk('p_heal')*0.06;
    if(own==='archer')o.cd/=1.15;
    o.mult*=heroPow(own);
    o.dps=D.kind==='atk'?o.p*o.mult/o.cd:0;
    out.push(o);});
  return out;
}

// 敵は右から歩いてくる。前の敵ほど左で止まる
const ENG=i=>0.55+i*0.11;
function nextWave(){
  B.wi++;const w=B.st.w[B.wi];const last=B.wi===B.st.w.length-1;
  B.foes=B.foes.filter(f=>f.alive||f.at<1.2).concat(w.map((k,i)=>{const f=makeFoe(k,B.s,last&&B.st.last===k&&i===w.lastIndexOf(k),i);f.x=1.06+i*0.1;return f;}));
  B.items.forEach(o=>{if(o.D.first)o.armed=1;});
  if(!B.sim&&w.some(k=>FOES[k].boss)){banner(`${FOES[w.find(k=>FOES[k].boss)].nm}が現れた`,'#e0a0ff');sfx('foe');}
}
const SEAL_COLS=()=>{const cnt=[0,0,0,0];S.bag.forEach((it,i)=>{if(it&&ITEMS[it.id].kind!=='sup')cnt[i%COLS]++;});let best=0;for(let c=1;c<4;c++)if(cnt[c]>cnt[best])best=c;return best;};
const RANGED=new Set(['bow','staff','holy','trap']);
function stepBattle(dt){
  if(!B||B.paused)return;
  for(const h of B.heroes)h.at+=dt;for(const f of B.foes)f.at+=dt;
  if(B.phase==='won'||B.phase==='lost'){B.endT+=dt;for(const f of B.foes)if(!f.alive)f.x-=dt*0.25;
    if(!B.sim&&B.endT>(B.phase==='won'?0.9:2.2)&&B.nextS!=null){const n=B.nextS,sum=B.keepSum?B.sum:null;B.nextS=null;startStage(n,{sum});}return;}
  B.t+=dt;
  let live=B.foes.filter(f=>f.alive);
  if(!live.length){if(B.wi>=B.st.w.length-1){endStage(true);return;}B.gapT+=dt;if(B.wi<0||B.gapT>0.3){B.gapT=0;nextWave();live=B.foes.filter(f=>f.alive);}}
  // 歩く
  let eng=false;
  for(const f of B.foes){if(!f.alive){if(B.run)f.x-=dt*0.25;continue;}const tx=ENG(f.slot);if(f.x>tx+0.001)f.x=Math.max(tx,f.x-dt*0.42);else eng=true;}
  B.run=!eng;
  // ---- 味方の装備 ----
  if(B.sealT>0){B.sealT-=dt;if(B.sealT<=0){B.seal=-1;if(!B.sim)renderBagSeal();}}
  for(const o of B.items){if(o.off)continue;const h=B.heroes[o.hi];if(!h||!h.alive)continue;if(B.seal>=0&&o.slot%COLS===B.seal)continue;
    const can=hasTarget(o);if(o.armed&&can){o.armed=0;useItem(o,h,true);}
    o.t=Math.min(o.cd,o.t+dt);if(o.t>=o.cd&&can){o.t=0;useItem(o,h);if(o.D.twice&&++o.n%o.D.twice===0)useItem(o,h,true);if(o.echo&&++o.en%4===0)useItem(o,h,true);}}
  // ---- 敵 ----
  for(const f of B.foes){if(!f.alive)continue;
    if(f.burn.length){let d=0;f.burn=f.burn.filter(b=>{const x=Math.min(dt,b.t);d+=b.dps*x;b.t-=dt;return b.t>0;});if(d>0)hurtFoe(f,d,'fire',true);if(!f.alive)continue;}
    if(f.chill>0)f.chill-=dt;
    if(f.x>ENG(f.slot)+0.001)continue;// まだ歩いている
    if(f.boss&&!f.rage&&(f.boss==='rage'||f.boss==='king')&&f.hp<f.max*0.5){f.rage=true;if(!B.sim){banner(`${f.F.nm}が怒った（攻撃1.5倍）`,'#ff8a6a');sfx('foe');}}
    if(f.boss==='seal'||f.boss==='king'){f.healT+=dt;if(f.healT>=8){f.healT=0;B.seal=SEAL_COLS();B.sealT=4;if(!B.sim){banner(`${f.F.nm}が鞄の${B.seal+1}列目を止めた`,'#c79aff');sfx('freeze');renderBagSeal();}}}
    f.t+=dt*(f.chill>0?0.6:1);
    if(f.t>=f.cd){f.t-=f.cd;foeAct(f);}}
  if(B.heroes.every(h=>!h.alive))endStage(false);
}
// 近接は目の前の敵だけ、弓・杖は見えている敵を撃てる
function hasTarget(o){if(o.kind==='heal')return B.heroes.some(h=>h.alive&&h.hp<h.max);if(o.kind==='shield')return B.foes.some(f=>f.alive&&f.x<0.97);
  return !!targetOf(o);}
function targetOf(o){return B.foes.find(f=>f.alive&&(RANGED.has(o.cls)?f.x<0.97:f.x<=ENG(f.slot)+0.001));}
function useItem(o,h,extra){
  h.anim='attack';h.at=0;o.flash=0.18;
  if(o.kind==='atk'){
    const t0=targetOf(o);if(!t0)return;const tg=o.D.aoe?B.foes.filter(f=>f.alive&&f.x<0.97):[t0];
    let m=o.mult;if(h.j==='berserker')m*=1+(0.4+skRank('berserker','b_rage')*0.06)*(1-h.hp/h.max);
    let crit=(o.D.crit||0)+(h.j==='archer'?skRank('archer','a_crit')*0.02:0);const isCrit=Math.random()<crit;if(isCrit)m*=2;
    for(const f of tg){let d=o.p*m*resOf(f.k,o.el);
      if(f.F.tr==='armor'&&!o.D.pierce)d*=0.55;
      if(o.D.exec&&f.hp<f.max*0.3)d*=2;
      if(f.strong){if(o.D.strong)d*=1.5;if(h.j==='hunter')d*=1.15+skRank('hunter','h_beast')*0.05;}
      B.dealt.n++;B.dealt.res+=resOf(f.k,o.el);
      hurtFoe(f,d,o.el,false,isCrit);
      if(o.el==='fire')f.burn.push({dps:d*0.4*(1+skRank(h.j,'m_burn')*0.1)/3,t:3});
      if(o.el==='ice')f.chill=Math.max(f.chill,2*(1+skRank(h.j,'m_chill')*0.1));
      if(o.el==='thun'){const o2=B.foes.find(x=>x.alive&&x!==f);if(o2&&o2.x<0.97)hurtFoe(o2,d*0.5*(1+skRank(h.j,'m_chain')*0.08),'thun');}
      if(h.j==='berserker'){const lr=skRank('berserker','b_leech')*0.01;if(lr)healHero(h,d*lr,true);}}
    if(!B.sim){shot(o,h,tg[0],isCrit);}
  }else if(o.kind==='shield'){const v=o.p*o.mult;h.bar=Math.min(h.max*0.8,h.bar+v);if(!B.sim){numAt(heroX(h.idx),0.42,`+${Math.round(v)}`,'#7fc3ff');sfx('shield');}
    if(o.D.mirror){for(const f of B.foes)if(f.alive)hurtFoe(f,v*0.5,'phys');}}
  else if(o.kind==='heal'){const v=o.p*o.mult;const tg=o.D.all?B.heroes.filter(x=>x.alive):[B.heroes.filter(x=>x.alive).sort((a,b)=>a.hp/a.max-b.hp/b.max)[0]].filter(Boolean);
    for(const t of tg){const got=healHero(t,v);const pb=skRank(h.j,'p_bar')*0.03;if(pb&&got>0)t.bar=Math.min(t.max*0.8,t.bar+got*pb);}if(!B.sim)sfx('heal');}
}
function healHero(h,v,quiet){const got=Math.min(h.max-h.hp,v);h.hp+=got;if(!B.sim&&!quiet&&got>=1)numAt(heroX(h.idx),0.5,`+${Math.round(got)}`,'#8fe07a');return got;}
function hurtFoe(f,d,el,dot,crit){if(!f.alive)return;f.hp-=d;if(!B.sim&&!dot){f.anim='hit';f.at=0;numAt(f.x,0.5,Math.round(d)+(crit?'!':''),EL_COL[el],crit);}
  if(f.hp<=0){f.hp=0;f.alive=false;f.anim='death';f.at=0;killFoe(f);}}
const EL_COL={phys:'#f3e9d8',fire:'#ff8a5a',ice:'#8fd8ff',thun:'#ffe066'};
function foeAct(f){
  f.anim='attack';f.at=0;
  if(f.F.tr==='heal'&&Math.random()<0.5){const t=B.foes.filter(x=>x.alive).sort((a,b)=>a.hp/a.max-b.hp/b.max)[0];if(t&&t.hp<t.max){t.hp=Math.min(t.max,t.hp+t.max*0.12);if(!B.sim)numAt(t.x,0.5,'回復','#8fe07a');return;}}
  const alive=B.heroes.filter(h=>h.alive);if(!alive.length)return;
  let tg=f.F.tr==='aoe'?alive:[f.F.tr==='back'?alive[alive.length-1]:alive[0]];
  const atk=f.atk*(f.rage?1.5:1)*(f.F.tr==='aoe'?0.55:1);
  for(const h of tg)hitHero(h,atk,f.F.tr==='toxic');

function hitHero(h,d,toxic){

  for(const [k,n] of Object.entries(SAMPLE_FILES))for(let i=0;i<n;i++)get(`${k}_${i}.m4a`).then(buf=>{(SAMP[k]=SAMP[k]||[]).push(buf);}).catch(()=>{});
  for(const k of ['home','shop','battle','boss'])get(`bgm_${k}.m4a`).then(buf=>{BGMB[k]=buf;if(BGM.want===k){BGM.cur=null;setMusic(k);}}).catch(()=>{});}

// ---------- 倉庫 ----------
function renderStash(m){
  const list=stashKeys(S.sfilter);const total=Object.values(S.stash).reduce((a,b)=>a+b,0);
  const mergeable=list.filter(k=>S.stash[k]>=2&&+k.split('|')[1]<STAR_MAX);
  m.innerHTML=`<div class="win"><div class="wt">倉庫</div><div class="sub" style="margin:-4px 0 6px;font-size:12px">${total}個・${Object.keys(S.stash).length}種類。上限なし、勝手に捨てない</div>
  <div class="chips">${FL.map(([k,n])=>`<button data-f="${k}" class="${S.sfilter===k?'on':''}">${n}</button>`).join('')}</div>
  <div class="chips">${[['new','新着順'],['kind','種類順'],['star','段階順']].map(([k,n])=>`<button data-s="${k}" class="${S.ssort===k?'on':''}">${n}</button>`).join('')}<button id="bAllMerge" ${mergeable.length?'':'disabled'} style="margin-left:auto">まとめて合わせる</button></div>
  <div class="sub">同じ品・同じ段階を2つ合わせると、1段階上の品になる（必ず成功）。</div></div>
  <div class="list">${list.map(k=>{const [id,st]=k.split('|');const D=ITEMS[id];const n=S.stash[k];const can=n>=2&&+st<STAR_MAX;
    return `<div class="li"><div class="ic">${itemHTML({id,st:+st})}</div><div class="tx"><b>${esc(D.nm)} <span style="color:var(--r${st})">${STAR_NM[st]}</span></b>${S.newk[k]?'<span class="newdot">新</span>':''}<small>${n}個・${itemLines({id,st:+st},null)[0].replace(/<[^>]+>/g,'')}</small></div>
      ${can?`<button class="btn sm" data-m="${k}">合わせる ${MERGE_COST(+st)}G</button>`:''}<button class="btn sm" data-sell="${k}">売る ${SELL_PRICE(id,+st)}G</button></div>`;}).join('')||'<div class="sub">空っぽ</div>'}</div>`;
  m.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.sfilter=b.dataset.f;renderStash(m);});
  m.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{S.ssort=b.dataset.s;save();renderStash(m);});
  m.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mergeOne(b.dataset.m);renderStash(m);});
  m.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>{const k=b.dataset.sell;const [id,st]=k.split('|');
    if(S.stash[k]===1&&!confirmBox(`${ITEMS[id].nm}${STAR_NM[st]}は最後の1個。売る？`))return;S.stash[k]--;if(!S.stash[k]){delete S.stash[k];delete S.newk[k];}S.gold+=SELL_PRICE(id,+st);sfx('coin');save();renderTop();renderStash(m);});
  $('bAllMerge').onclick=()=>allMerge(m);
  setTimeout(()=>{for(const k of list)delete S.newk[k];},50);
}
function mergeOne(k){const [id,st]=k.split('|');const c=MERGE_COST(+st);if(S.gold<c){toast('お金が足りない','#ff9a7a');sfx('err');return false;}
  if(!(S.stash[k]>=2))return false;S.gold-=c;S.stash[k]-=2;if(!S.stash[k])delete S.stash[k];addStash(id,+st+1,true);S.stats.drops--;sfx('merge');toast(`${ITEMS[id].nm}が${STAR_NM[+st+1]}になった`,`var(--r${+st+1})`);save();renderTop();return true;}
function allMerge(m){// 結果を先に見せる
  const sim={...S.stash};let cost=0;const res=[];
  for(let st=1;st<STAR_MAX;st++)for(const id of Object.keys(ITEMS)){const k=id+'|'+st;while((sim[k]||0)>=2){const c=MERGE_COST(st);if(S.gold-cost<c)break;cost+=c;sim[k]-=2;sim[id+'|'+(st+1)]=(sim[id+'|'+(st+1)]||0)+1;res.push(`${ITEMS[id].nm}${STAR_NM[st+1]}`);}}
  if(!res.length){toast('合わせられる品がない（お金が足りないかも）','#ff9a7a');return;}
  const cnt={};res.forEach(r=>cnt[r]=(cnt[r]||0)+1);
  modal(`<h2>まとめて合わせる</h2><div>${Object.entries(cnt).map(([r,n])=>`${esc(r)} ×${n}`).join('<br>')}</div><p class="sub">かかるお金：${cost}G（今 ${fmt(S.gold)}G）。鞄に入っている品は使わない。</p><div class="row"><button class="btn" data-x>やめる</button><button class="btn go" id="mOk">合わせる</button></div>`);
  $('mOk').onclick=()=>{S.gold-=cost;for(const k in sim){if(sim[k]>(S.stash[k]||0)){S.newk[k]=1;}}S.stash=Object.fromEntries(Object.entries(sim).filter(([k,v])=>v>0));sfx('merge');closeModal();save();renderAll();};}

// ---------- 地図 ----------
const MAP_PTS=[[18,86],[40,78],[64,84],[84,70],[66,56],[40,60],[18,46],[36,30],[62,34],[82,16]];
function renderMap(m){if(renderMap._cur!==S.cur){renderMap._cur=S.cur;S.mapR=STAGES[S.cur].ri;}const ri=S.mapR||0;const R=REGIONS[ri];
  m.innerHTML=`<div id="map"><div class="rtabs">${REGIONS.map((r,i)=>`<button data-r="${i}" class="${i===ri?'on':''}" ${regionOpen(i)?'':'disabled'}>${i+1} ${r.nm}</button>`).join('')}</div>
  <div id="mapc" style="background-image:linear-gradient(rgba(20,14,10,.45),rgba(20,14,10,.65)),url('${srcOf(`${A}bg2/${R.bg[0]}.png`)}')"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><polyline points="${MAP_PTS.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#e8d8b0" stroke-width="0.8" stroke-dasharray="2 1.6" opacity=".7"/></svg>
  ${R.st.map((st,i)=>{const s=ri*10+i,op=stageOpen(s),dn=S.clear[s]>0;const g=STAGES[s];const mk=g.tag==='boss'?'<span class="m tag-boss">ボス</span>':g.tag==='strong'?'<span class="m tag-strong">強</span>':g.tag==='bad'?'<span class="m tag-bad">相性</span>':'';
    return `<button class="pt ${dn?'done':op?'open':'lock'}${S.cur===s?' cur':''}" data-s="${s}" style="left:${MAP_PTS[i][0]}%;top:${MAP_PTS[i][1]}%" ${op?'':'disabled'}>${i+1}${mk}</button>`;}).join('')}</div>
  <div style="margin-top:8px">${stageCard(STAGES[S.cur])}</div>
  <div class="sub" style="margin:-4px 0 6px">クリア ${S.clear[S.cur]||0}回${FIRST_GIFT[S.cur]&&!(S.clear[S.cur]>0)?`・初回のごほうび：${ITEMS[FIRST_GIFT[S.cur]].nm}`:''}</div>
  <div class="row"><button class="btn" id="mLoop" ${S.clear[S.cur]>0?'':'disabled'}>この面を周回</button><button class="btn go" id="mGo">この面へ行く</button></div></div>`;
  m.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S.mapR=+b.dataset.r;sfx('tick');renderMap(m);});
  m.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{S.cur=+b.dataset.s;sfx('tick');save();renderMap(m);});
  const go=loop=>{S.loopOn=loop;S.notes=(S.notes||[]).filter(n=>n.kind!=='lose');S.tab='adv';audio();startStage(S.cur,{});renderAll();};
  $('mGo').onclick=()=>go(false);$('mLoop').onclick=()=>go(true);}

// ---------- 町 ----------
function renderTown(m){
  const seen=Object.keys(ITEMS).filter(k=>S.seen[k]);const unseen=Object.keys(ITEMS).length-seen.length;
  m.innerHTML=`<div class="win"><div class="wt">店</div><div class="sub" style="margin:-4px 0 6px;font-size:12px">一度でも手に入れた品を、指名して買える</div>
   <div class="list">${seen.map(id=>{const D=ITEMS[id],p=BUY_PRICE(id);return `<div class="li"><div class="ic">${itemHTML({id,st:1})}</div><div class="tx"><b>${esc(D.nm)}</b><small>${itemLines({id,st:1},null)[0].replace(/<[^>]+>/g,'')}</small></div><button class="btn sm" data-buy="${id}" ${S.gold<p?'disabled':''}>${fmt(p)}G</button></div>`;}).join('')}</div>
   ${unseen?`<div class="sub">まだ見つけていない品：${unseen}種類</div>`:''}</div>
  <div class="win"><div class="wt">訓練所</div><div class="sub" style="margin:-4px 0 6px;font-size:12px">ずっと続く強化。上げるほど高くなる</div>
   <div class="list">${Object.entries(TRAIN).map(([k,T])=>{const n=S.train[k],c=TRAIN_COST(k,n);return `<div class="li"><div class="tx"><b>${T.nm} ${n}段</b><small>${T.ds}（今 +${Math.round(n*T.per*100)}%）</small></div><button class="btn sm" data-tr="${k}" ${S.gold<c?'disabled':''}>${fmt(c)}G</button></div>`;}).join('')}</div></div>
  <div class="win"><div class="wt">施設</div><div class="list">${Object.entries(FAC).map(([k,F])=>{const n=S.fac[k],mx=n>=F.lv.length-1||!F.cost[n+1];const c=F.cost[n+1];return `<div class="li"><div class="tx"><b>${F.nm}</b><small>${F.ds}：${F.lv[n]===999?'無制限':F.lv[n]+F.unit}${mx?'':`→ ${F.lv[n+1]===999?'無制限':F.lv[n+1]+F.unit}`}</small></div>${mx?'<span class="sub">最大</span>':`<button class="btn sm" data-fac="${k}" ${S.gold<c?'disabled':''}>${fmt(c)}G</button>`}</div>`;}).join('')}</div>
   ${S.fac.sets>0||FAC.sets.lv[S.fac.sets]>0?setsHTML():''}</div>`;
  m.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const id=b.dataset.buy,p=BUY_PRICE(id);if(S.gold<p)return;S.gold-=p;addStash(id,1,true);S.stats.drops--;sfx('buy');toast(`${ITEMS[id].nm}を買った（倉庫へ）`);save();renderTop();renderTown(m);});
  m.querySelectorAll('[data-tr]').forEach(b=>b.onclick=()=>{const k=b.dataset.tr,c=TRAIN_COST(k,S.train[k]);if(S.gold<c)return;S.gold-=c;S.train[k]++;sfx('special');save();renderTop();renderTown(m);});
  m.querySelectorAll('[data-fac]').forEach(b=>b.onclick=()=>{const k=b.dataset.fac,c=FAC[k].cost[S.fac[k]+1];if(S.gold<c)return;S.gold-=c;S.fac[k]++;sfx('special');save();renderTop();renderTown(m);});
  m.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{S.sets[+b.dataset.save]={bag:S.bag.map(x=>x&&{...x}),party:S.party.slice()};sfx('tick');toast('鞄の並べ方を保存した');save();renderTown(m);});
  m.querySelectorAll('[data-lo]').forEach(b=>b.onclick=()=>{loadSet(+b.dataset.lo);renderTown(m);});
}
function setsHTML(){const n=FAC.sets.lv[S.fac.sets];let h='<div style="margin-top:6px"><b class="dot" style="font-weight:normal">鞄の並べ方</b>';for(let i=0;i<n;i++){const s=S.sets[i];h+=`<div class="li"><div class="tx"><b>${i+1}つ目</b><small>${s?s.bag.filter(Boolean).map(x=>ITEMS[x.id].nm).slice(0,5).join('・')+'…':'空き'}</small></div><button class="btn sm" data-save="${i}">今の鞄を保存</button>${s?`<button class="btn sm" data-lo="${i}">呼び出す</button>`:''}</div>`;}return h+'</div>';}
function loadSet(i){const s=S.sets[i];if(!s)return;// 倉庫にある分だけ並べ直す
  const pool={...S.stash};S.bag.forEach(it=>{if(it){const k=it.id+'|'+it.st;pool[k]=(pool[k]||0)+1;}});const nb2=Array(BAG_N).fill(null);let miss=0;
  s.bag.forEach((it,i)=>{if(!it)return;const k=it.id+'|'+it.st;if(pool[k]>0){pool[k]--;nb2[i]={...it};}else miss++;});
  S.stash=Object.fromEntries(Object.entries(pool).filter(([k,v])=>v>0));S.bag=nb2;markDirty();sfx('place');toast(miss?`呼び出した（${miss}個は倉庫に足りなかった）`:'呼び出した');save();}

// ---------- 勇者 ----------
let HSEL=null;
function renderHeroes(m){const j0=HSEL||S.party[0];const J=JOBS[j0];const pts=skPoints(j0);
  m.innerHTML=`<div class="win"><div class="wt">隊列</div><div class="sub" style="margin:-4px 0 6px;font-size:12px">職業を選び、入れたい位置を押す</div>
   <div class="jobs" style="grid-template-columns:repeat(3,1fr)">${S.party.map((j,i)=>`<button class="jb in" data-slot="${i}"><small>${['前','中','後ろ'][i]}</small><br>${faceBox(j,48)}<b>${JOBS[j].nm}</b></button>`).join('')}</div></div>
  <div class="win"><div class="wt">職業</div><div class="jobs">${JOB_ORDER.map(j=>{const un=S.unlocked[j];return `<button class="jb${S.party.includes(j)?' in':''}${j===j0?' sel':''}" data-j="${j}" ${un?'':'disabled'}><span style="display:inline-block;${un?'':'filter:brightness(.15)'}">${faceBox(j,48)}</span><b>${un?JOBS[j].nm:'？？？'}</b><small>${un?'ポイント '+skPoints(j):`${STAGES[JOB_UNLOCK[j]].nm}をクリア`}</small></button>`;}).join('')}</div></div>
  <div class="win"><div class="wt">${J.nm} <span class="sub dot" style="font-size:12px">HP ${heroMaxHP(j0)}・攻撃 ${(heroPow(j0)*100).toFixed(0)}%</span></div>
   <div class="sub">${esc(J.ps)}</div><div class="sub">得意：${Object.entries(J.aff).map(([c,a])=>`${CLS_NM[c]}${a}`).join('・')}（ほかは苦手で0.75倍）</div>
   <div class="row" style="margin:6px 0"><span class="dot">技のポイント ${pts}</span><button class="btn sm" id="hReset" style="margin-left:auto">振り直す（無料）</button></div>
   <div class="skl">${J.sk.map(([id,nm,ds,per])=>{const r=skRank(j0,id);return `<div class="sk"><div class="tx"><b>${nm}</b> <span class="pips">${r}/${SK_MAX}</span><div class="sub" style="font-size:12px">${esc(ds)}${r?`（今 ${id==='p_rev'?r*3+'%':'+'+r*per+'%'}）`:''}</div></div><button class="btn sm" data-sk="${id}" ${pts>0&&r<SK_MAX?'':'disabled'}>上げる</button></div>`;}).join('')}</div></div>`;
  m.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{HSEL=b.dataset.j;sfx('tick');renderHeroes(m);});
  m.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{const i=+b.dataset.slot;const j=HSEL;if(!j||S.party[i]===j){HSEL=S.party[i];renderHeroes(m);return;}
    
    const k=S.party.indexOf(j);if(k>=0){S.party[k]=S.party[i];}S.party[i]=j;
    S.bag.forEach(it=>{if(it&&it.own&&!S.party.includes(it.own))it.own=bestOwner(it.id);});sfx('place');save();renderAll();});
  m.querySelectorAll('[data-sk]').forEach(b=>b.onclick=()=>{const id=b.dataset.sk;if(skPoints(j0)<=0)return;S.sk[j0][id]=skRank(j0,id)+1;sfx('tick');save();renderHeroes(m);});
  $('hReset').onclick=()=>{S.sk[j0]={};sfx('reroll');save();renderHeroes(m);};
}

// ---------- 窓 ----------
function modal(h){$('mcard').innerHTML=h;$('modal').classList.add('on');$('mcard').querySelectorAll('[data-x]').forEach(b=>b.onclick=closeModal);}
function closeModal(){$('modal').classList.remove('on');}
const modalOpen=()=>$('modal').classList.contains('on');
function confirmBox(t){return window.confirm(t);}
function gainGrid(drops){const c={};drops.forEach(d=>{const k=d.id+'|'+d.st;c[k]=(c[k]||0)+1;});return `<div class="gain">${Object.entries(c).map(([k,n])=>{const [id,st]=k.split('|');return `<div class="g">${itemHTML({id,st:+st})}<span class="num">${n>1?'×'+n:''}</span></div>`;}).join('')}</div>`;}
function showMenu(){modal(`<h2>その他</h2>
  <p class="sub">遊び方：面は自動で進む。勝つと次の面へ。勝てない面は前の面を周回してレベルを上げるか、敵に効く属性の石を武器の隣に置く。落とした品は全部倉庫に入る。</p>
  <p class="sub">勝った数 ${S.stats.wins}・負けた数 ${S.stats.loses}・倒した敵 ${S.stats.kills}</p>
  <div class="row" style="flex-wrap:wrap"><button class="btn" id="mReset">最初からやり直す</button><button class="btn go" data-x>閉じる</button></div>
  <div class="credit" style="color:#6a5236">素材：キャラの絵 LuizMelo（CC0。狩人・僧侶はその色違い）／装備アイコン Shikashi's Fantasy Icons・Matt Firth (shikashipx)（CC BY 4.0）／背景 Codex の画像生成／効果音 Kenney「RPG Audio」「Impact Sounds」「Interface Sounds」（CC0）／曲 Juhani Junkala「Chiptune Adventures」（CC0）</div>`);
  $('mReset').onclick=()=>{if(!confirmBox('セーブを消して最初からやり直す？（元に戻せない）'))return;localStorage.removeItem(SAVE_KEY);location.reload();};}

// ===================== 起動 =====================
async function boot(){
  load();sizeStage();addEventListener('resize',()=>{sizeStage();});
  renderAll();
  await preload();
  const o=offlineGain();if(o)setNotice({kind:'off',o});
  requestAnimationFrame(frame);
  setInterval(()=>{if(S.tab==='adv'&&B)renderParty();renderTop();},500);
  document.addEventListener('visibilitychange',()=>{if(document.hidden){S.last=Date.now();save(true);}else{const o=offlineGain();if(o&&o.sec>120)setNotice({kind:'off',o});}});
  addEventListener('pointerdown',()=>{audio();if(!S.muted&&!BGM.cur)setMusic(B?REGIONS[B.st.ri].song:'home');},{once:true});
  // 前に遊んでいたら、開いたらそのまま進み続ける
  if(S.auto)startStage(stageOpen(S.cur)?S.cur:frontier(),{});
  window.__v3={GROW,get S(){return S;},get B(){return B;},startStage,simStage,compileBag,STAGES,save,renderAll};
}
boot();

</script>
