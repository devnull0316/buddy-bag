<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>王様の鞄 遠征記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --ink:#16110d;--wood:#2a2019;--wood-hi:#3a2c22;--leather:#7a4b2c;--leather-dk:#4d2f1c;--stitch:#d2a46a;
  --parch:#ecdcb8;--parch-ink:#2b1d12;--brass:#e2b04f;--brass-dk:#9a7024;--text:#f3e9d8;--sub:#bfae95;--edge:#0d0a08;
  --phys:#c9c2b4;--fire:#e8673c;--ice:#6fc3e8;--thun:#e8cf4a;
  --r1:#a99a86;--r2:#5fa6e0;--r3:#b77ee8;--r4:#e2b04f;--r5:#e8583c;
  --cell:min(76px,calc((100vw - 64px)/4));
  --bevel:inset 2px 2px 0 rgba(255,236,200,.10),inset -2px -2px 0 rgba(0,0,0,.38);
  --f-dot:"DotGothic16","Zen Kaku Gothic New",monospace;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--ink);color:var(--text);font-family:var(--f-body);overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;touch-action:manipulation}
.dot{font-family:var(--f-dot);font-variant-numeric:tabular-nums}
#app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative}
#top{flex:none;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--wood);border-bottom:2px solid var(--edge);font-family:var(--f-dot);font-size:14px;padding-top:max(6px,env(safe-area-inset-top))}
#top .lv{background:#3a2c22;padding:1px 6px;border:1px solid var(--edge)}
#top .xpbar{width:64px;height:6px;background:#0d0a08;position:relative}#top .xpbar i{position:absolute;inset:0 auto 0 0;background:#7fc06a}
#top .gold{color:var(--brass);margin-left:auto}
#top .ib{background:rgba(0,0,0,.25);border:1px solid var(--edge);padding:2px 8px;min-height:28px;font-family:var(--f-dot);font-size:13px;color:var(--sub)}
#stagewrap{flex:none;position:relative;height:clamp(118px,17dvh,150px);background:#120e14;border-top:3px solid #120b08;box-shadow:0 -2px 0 #5a2f22}
#stage{width:100%;height:100%;display:block;image-rendering:pixelated}
#hud{position:absolute;left:6px;right:6px;top:4px;display:flex;gap:6px;align-items:center;font-family:var(--f-dot);font-size:13px;pointer-events:none}
#hud .pill{background:rgba(13,10,8,.72);padding:1px 7px;border:1px solid rgba(0,0,0,.6)}
#hud .btns{margin-left:auto;display:flex;gap:4px;pointer-events:auto}
#hud .btns button{background:rgba(13,10,8,.78);border:1px solid #4a3a2a;font-family:var(--f-dot);font-size:13px;min-width:38px;min-height:30px;padding:0 6px}
#hud .btns button.on{border-color:var(--brass);color:var(--brass)}
#feed{position:absolute;left:0;right:0;bottom:calc(100% + 6px);display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none;z-index:5}
#feed .t{display:flex;align-items:center;gap:6px;background:rgba(13,10,8,.88);font-family:var(--f-dot);font-size:13px;padding:2px 10px 2px 4px;border:1px solid #000;box-shadow:0 0 0 1px #5a2f22;animation:tl 3s forwards}
#feed .t img{width:22px;height:22px;image-rendering:pixelated}
#feed .t .k{color:var(--sub)}
@keyframes tl{0%{opacity:0;transform:translateY(4px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:8px 10px 12px}
#tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--wood);border-top:2px solid var(--edge);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{background:none;border:0;border-right:1px solid var(--edge);padding:8px 0 7px;font-family:var(--f-dot);font-size:14px;color:var(--sub);position:relative;min-height:46px}
#tabs button.on{color:var(--text);background:var(--wood-hi);box-shadow:inset 0 3px 0 var(--brass)}
#tabs .badge{position:absolute;top:5px;right:calc(50% - 26px);width:8px;height:8px;background:#e8583c;border:1px solid #000}
.card{background:var(--wood);border:2px solid var(--edge);box-shadow:var(--bevel);padding:8px 10px;margin-bottom:8px}
.card h3{margin:0 0 4px;font-family:var(--f-dot);font-weight:normal;font-size:15px}
.sub{color:var(--sub);font-size:13px}
.row{display:flex;gap:8px;align-items:center}
.btn{background:#3a2c22;border:2px solid var(--edge);box-shadow:var(--bevel);font-family:var(--f-dot);font-size:15px;padding:8px 12px;min-height:44px}
.btn:disabled{opacity:.45}
.btn.go{background:var(--brass);color:var(--parch-ink);box-shadow:inset 0 -3px 0 var(--brass-dk);flex:1}
.btn.sm{font-size:13px;padding:4px 8px;min-height:34px}
.el{display:inline-block;font-family:var(--f-dot);font-size:12px;padding:0 4px;color:#1a120c;margin-right:2px;line-height:1.5}
.el.phys{background:var(--phys)}.el.fire{background:var(--fire)}.el.ice{background:var(--ice)}.el.thun{background:var(--thun)}
.mk{font-family:var(--f-dot);font-size:12px;margin-left:1px}
.mk.good{color:#8fe07a}.mk.bad{color:#ff7a5a}.mk.mid{color:var(--sub)}
/* 次の面 */
#next .foes{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
#next .foe{display:flex;align-items:center;gap:4px;background:#1f1812;padding:2px 6px 2px 2px;border:1px solid var(--edge);font-size:13px}
#next .foe img{width:28px;height:28px;object-fit:contain;image-rendering:pixelated}
#next .eff{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;font-family:var(--f-dot);font-size:13px}
#next .tagx,.mini .tagx{font-family:var(--f-dot);font-size:12px;padding:0 5px;margin-left:4px}
.tag-strong{background:#b4442e;color:#fff}.tag-boss{background:#7a2a8a;color:#fff}.tag-bad{background:#2e5a8a;color:#fff}
/* 鞄 */
#bagwrap{position:relative;display:flex;flex-direction:column;align-items:center;margin:6px 0}
#bag{display:grid;grid-template-columns:repeat(4,var(--cell));grid-template-rows:repeat(3,var(--cell));gap:4px;padding:8px;background:var(--leather);border:3px solid var(--edge);box-shadow:inset 0 0 0 2px var(--stitch),var(--bevel);position:relative}
#bag .cell{position:relative;background:var(--leather-dk);box-shadow:inset 2px 2px 0 rgba(0,0,0,.4),inset -1px -1px 0 rgba(255,220,180,.08);display:flex;align-items:center;justify-content:center;touch-action:none}
#bag .cell.tgt{outline:2px dashed var(--brass);outline-offset:-3px}
#bag .cell.sel{outline:3px solid #fff;outline-offset:-3px;z-index:2}
#bag .cell.adj{box-shadow:inset 0 0 0 3px rgba(226,176,79,.55)}
#bag .cell .cdb{position:absolute;left:3px;bottom:3px;height:3px;width:0;max-width:calc(100% - 6px);background:#e2b04f;box-shadow:0 0 0 1px #000;pointer-events:none}
#bag .cell.fire{box-shadow:inset 0 0 0 3px #ffe9a8,inset 0 0 14px rgba(255,220,140,.55)}
#bag .cell.seal::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(80,40,120,.55) 0 6px,rgba(30,10,50,.55) 6px 12px)}
.it{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.it img{width:78%;height:78%;object-fit:contain;image-rendering:pixelated;pointer-events:none}
.it .st{position:absolute;left:2px;top:1px;font-family:var(--f-dot);font-size:12px;color:#ffe9a8;text-shadow:1px 1px 0 #000}
.it .own{position:absolute;right:1px;bottom:1px;width:20px;height:20px;border:1px solid #000;background:#1a120c;overflow:hidden}
.it .own img{width:100%;height:100%;object-fit:cover;object-position:top}
.it .elb{position:absolute;left:2px;bottom:2px;width:8px;height:8px;border:1px solid #000}
.it.r1{box-shadow:inset 0 0 0 2px var(--r1)}.it.r2{box-shadow:inset 0 0 0 2px var(--r2)}.it.r3{box-shadow:inset 0 0 0 2px var(--r3)}.it.r4{box-shadow:inset 0 0 0 2px var(--r4)}.it.r5{box-shadow:inset 0 0 0 2px var(--r5)}
.it.off img{opacity:.35}
.it .num{position:absolute;right:2px;top:1px;font-family:var(--f-dot);font-size:12px;color:#fff;text-shadow:1px 1px 0 #000}
#bagnote{font-family:var(--f-dot);font-size:12px;color:var(--brass);height:16px;margin-top:2px}
/* 選んだ品の説明 */
#info{min-height:64px}
#info .nm{font-family:var(--f-dot);font-size:15px}
#info .line{font-size:13px;color:var(--sub);line-height:1.45;margin-top:2px}
#info .owners{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
#info .owners button{display:flex;align-items:center;gap:4px;background:#1f1812;border:2px solid var(--edge);padding:2px 6px;font-size:12px;min-height:34px}
#info .owners button.on{border-color:var(--brass)}
#info .owners img{width:22px;height:22px;object-fit:cover;object-position:top;image-rendering:pixelated}
/* 隊列 */
#party{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#party .pm{background:#1f1812;border:2px solid var(--edge);padding:4px;display:flex;gap:6px;align-items:center;min-height:52px}
#party .pm img{width:36px;height:36px;object-fit:cover;object-position:top;image-rendering:pixelated;background:#120e0b}
#party .pm .pos{font-family:var(--f-dot);font-size:12px;color:var(--sub)}
#party .pm .nm{font-family:var(--f-dot);font-size:13px}
/* 倉庫の帯 */
#strip{display:flex;gap:4px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:thin}
#strip .sitem{flex:none;width:58px;height:58px;background:#1f1812;border:2px solid var(--edge);position:relative}
#strip .sitem.sel{border-color:#fff}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0}
.chips button{background:#1f1812;border:1px solid var(--edge);font-family:var(--f-dot);font-size:13px;padding:3px 9px;min-height:32px;color:var(--sub)}
.chips button.on{color:var(--text);border-color:var(--brass)}
/* 倉庫の一覧 */
.list .li{display:flex;align-items:center;gap:8px;padding:5px 6px;background:#1f1812;border:1px solid var(--edge);margin-bottom:4px;min-height:52px}
.list .li .ic{width:44px;height:44px;flex:none}
.list .li .tx{flex:1;min-width:0}
.list .li .tx b{font-family:var(--f-dot);font-weight:normal;font-size:14px}
.list .li .tx small{display:block;color:var(--sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.newdot{display:inline-block;background:#e8583c;color:#fff;font-family:var(--f-dot);font-size:12px;padding:0 3px;margin-left:4px}
/* 地図 */
#map .rtabs{display:flex;gap:4px;margin-bottom:6px}
#map .rtabs button{flex:1;background:#1f1812;border:2px solid var(--edge);font-family:var(--f-dot);font-size:14px;padding:6px 0;min-height:42px;color:var(--sub)}
#map .rtabs button.on{color:var(--text);border-color:var(--brass)}
#map .rtabs button:disabled{opacity:.4}
#mapc{position:relative;width:100%;aspect-ratio:1/1.05;background:#2b2118;border:3px solid var(--edge);overflow:hidden;background-size:cover;background-position:center;image-rendering:pixelated}
#mapc svg{position:absolute;inset:0;width:100%;height:100%}
#mapc .pt{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid #1a120c;background:#6b5844;font-family:var(--f-dot);font-size:14px;display:flex;align-items:center;justify-content:center;color:#fff;text-shadow:1px 1px 0 #000}
#mapc .pt.done{background:#4f7a3a}#mapc .pt.open{background:var(--brass);color:var(--parch-ink);text-shadow:none}#mapc .pt.lock{background:#3a3028;color:#776}
#mapc .pt.cur{box-shadow:0 0 0 3px #fff}
#mapc .pt .m{position:absolute;top:-10px;right:-10px;font-size:12px;padding:0 3px;border:1px solid #000}
/* 窓 */
#modal{position:fixed;inset:0;background:rgba(5,3,2,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
#modal.on{display:flex}
#mcard{width:100%;max-width:440px;max-height:88dvh;overflow-y:auto;background:var(--parch);color:var(--parch-ink);border:3px solid var(--edge);box-shadow:inset 0 0 0 2px #c9b48a;padding:14px}
#mcard h2{margin:0 0 8px;font-family:var(--f-dot);font-weight:normal;font-size:19px}
#mcard .btn{background:#e6d2a6;color:var(--parch-ink);box-shadow:inset 0 -3px 0 #b39867}
#mcard .btn.go{background:var(--brass)}
#mcard .sub{color:#6a5236}
#mcard .gain{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:4px;margin:6px 0}
#mcard .gain .g{background:#d9c497;border:1px solid #8a7048;height:52px;position:relative}
.why{background:#f5ead0;border-left:4px solid #b4442e;padding:6px 8px;margin:6px 0;font-size:14px}
.skl .sk{display:flex;align-items:center;gap:8px;padding:6px;background:#1f1812;border:1px solid var(--edge);margin-bottom:4px}
.skl .sk .tx{flex:1}.skl .sk b{font-family:var(--f-dot);font-weight:normal}
.skl .pips{font-family:var(--f-dot);font-size:12px;color:var(--brass)}
.jobs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.jobs .jb{background:#1f1812;border:2px solid var(--edge);padding:6px 4px;text-align:center;min-height:96px}
.jobs .jb.in{border-color:var(--brass)}.jobs .jb.sel{box-shadow:0 0 0 2px #fff}
.jobs .jb img{width:48px;height:48px;object-fit:cover;object-position:top;image-rendering:pixelated}
.jobs .jb b{display:block;font-family:var(--f-dot);font-weight:normal;font-size:14px}
.jobs .jb small{font-size:12px;color:var(--sub)}
.credit{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.5}
.fly{position:fixed;pointer-events:none;z-index:60;font-family:var(--f-dot);font-size:14px;text-shadow:1px 1px 0 #000;animation:fly .8s ease-out forwards}
@keyframes fly{to{transform:translateY(-28px);opacity:0}}
@media (prefers-reduced-motion: reduce){.fly,#feed .t{animation-duration:.01s}}
/* タスクバーヒーロー風の窓 */
#main{background:#140d0a}
.win{position:relative;background:#2a1c16;border:3px solid #120b08;box-shadow:inset 0 0 0 2px #6a3324,inset 0 0 0 4px #1c120d,0 2px 0 #000;padding:22px 8px 8px;margin:14px 0 10px}
.win>.wt{position:absolute;left:50%;top:-12px;transform:translateX(-50%);background:linear-gradient(#8a3428,#5a1f1a);border:2px solid #120b08;box-shadow:inset 0 1px 0 #c0604a,0 0 0 1px #6a3324;font-family:var(--f-dot);font-size:15px;padding:2px 22px;white-space:nowrap;color:#f7e6c8;text-shadow:1px 1px 0 #000}
.win>.wt small{font-size:12px;color:#e8c8a8;margin-left:6px}
.slot{background:#1a120e;border:1px solid #0c0806;box-shadow:inset 2px 2px 0 #0c0806,inset -1px -1px 0 #3a2a20;position:relative}
#sgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
#sgrid .slot{aspect-ratio:1}
#sgrid .slot.sel{outline:2px solid #fff;outline-offset:-2px}
#sgrid .slot .num{position:absolute;right:2px;bottom:1px;font-family:var(--f-dot);font-size:12px;color:#fff;text-shadow:1px 1px 0 #000}
#sgrid .slot .newdot{position:absolute;left:0;top:0;margin:0}
.mini{display:flex;gap:6px;align-items:center;font-family:var(--f-dot);font-size:13px;flex-wrap:wrap}
.mini .foe{display:inline-flex;align-items:center;gap:2px;background:#1a120e;border:1px solid #0c0806;padding:1px 4px 1px 1px}
.note{background:#3a221a;border:2px solid #120b08;box-shadow:inset 0 0 0 1px #8a4a32;padding:6px 8px;margin-bottom:8px;font-size:13px;line-height:1.5}
.note b{font-family:var(--f-dot);font-weight:normal;font-size:14px;color:#ffd9a0}
.note .x{float:right;background:none;border:0;color:var(--sub);font-family:var(--f-dot);min-height:28px}
#tabs button img,#tabs button .tic{display:block;margin:0 auto 1px;width:22px;height:22px;image-rendering:pixelated}
#tabs button{padding:4px 0 5px;font-size:12px}
#hud .go{pointer-events:auto;position:absolute;left:50%;top:50%;transform:translate(-50%,-30%);background:var(--brass);color:var(--parch-ink);border:2px solid #000;box-shadow:inset 0 -3px 0 var(--brass-dk);font-family:var(--f-dot);font-size:17px;padding:8px 26px}
#party .pm{min-height:44px;padding:3px}
#party .hpb{height:5px;background:#0d0a08;margin-top:2px;position:relative}#party .hpb i{position:absolute;inset:0 auto 0 0;background:#7fc06a}#party .hpb u{position:absolute;inset:0 auto 0 0;background:#7fc3ff;opacity:.7}
/* v3: 小さな窓と、いつでも見える遠征の帯 */
:root{--cell:min(69px,calc((100vw - 66px)/4));--r1:#aa9684;--r2:#66b5f4;--r3:#c08aff;--r4:#ffc261;--r5:#ff7769}
button{cursor:pointer}button:focus-visible,[tabindex]:focus-visible{outline:3px solid #b9e6a0;outline-offset:2px}
#top{height:40px;font-size:13px;gap:6px}#top .ib{min-height:32px;padding:2px 6px;font-size:12px}#top .xpbar{width:42px}
#main{padding:5px 9px 12px;background:radial-gradient(ellipse at top,#322119,#170f0c 70%)}
.win{margin:15px 0 13px;padding:20px 8px 9px;background:linear-gradient(135deg,#30221b,#241913);border-color:#100b08;box-shadow:inset 0 0 0 1px #aa6040,inset 0 0 0 3px #4b2c21,0 3px 7px #0008}
.win>.wt{padding:2px 23px;font-weight:bold;font-size:14px;letter-spacing:2px}
#stline{margin-bottom:3px}.stage-brief{display:flex;gap:7px;align-items:center;width:100%;background:#1a130f;border:1px solid #68432e;padding:5px 7px;min-height:36px;font-size:12px;text-align:left}.stage-brief .stage-enemies{display:flex;margin-left:auto}
#bagwrap{margin:5px 0 4px}#bag{padding:7px;gap:4px;border-width:2px;background:#704329;box-shadow:inset 0 0 0 1px #bd9156,inset 0 0 12px #24140c}
#bag .cell{border:1px solid #aa77513d;background:#493020}.it{border:2px solid var(--rar);box-shadow:inset 1px 1px 0 #ffffff25,inset -1px -1px 0 #0005!important;background:linear-gradient(135deg,var(--tile-hi),var(--tile));overflow:hidden}
.it.r1{--rar:var(--r1);--tile:#51463d;--tile-hi:#756357}.it.r2{--rar:var(--r2);--tile:#173e6c;--tile-hi:#326fa0}.it.r3{--rar:var(--r3);--tile:#542872;--tile-hi:#8550ac}.it.r4{--rar:var(--r4);--tile:#91500e;--tile-hi:#c38826}.it.r5{--rar:var(--r5);--tile:#882d2a;--tile-hi:#c54e43}
.it img{filter:drop-shadow(1px 2px 0 #0009)}.it .st{font-size:12px;z-index:1}.it .own{width:18px;height:18px}.it .own span{transform:translate(-1px,-1px)}.it .elb{width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 1px #ffffff40}
#bag .cell.recommended{outline:3px solid #b6f199;outline-offset:1px;box-shadow:0 0 15px #95e37788;z-index:2}#bag .cell.recommended:after{content:'おすすめ';position:absolute;bottom:0;left:0;right:0;background:#214b28;color:#d8ffb9;font-size:12px;text-align:center;pointer-events:none}
#bagnote{height:19px;font-size:12px;color:#d9ba87;display:flex;align-items:center;gap:5px}#cancelPlace{border:0;background:none;color:#fff;text-decoration:underline;font-size:12px;min-height:24px}
#party{gap:4px}#party .pm{padding:3px 2px;gap:3px;min-height:46px;border:1px solid #75503b;background:#1b140f}#party .pm .nm{font-size:12px;white-space:nowrap}#party .pm .pos{font-size:12px}#party .pm .hpb{height:4px}

function gainXP(n){n=Math.round(n*(1+S.train.xp*TRAIN.xp.per));if(S.lv>=LV_MAX)return 0;S.xp+=n;let up=0;while(S.lv<LV_MAX&&S.xp>=xpNeed(S.lv)){S.xp-=xpNeed(S.lv);S.lv++;up++;}

// ===================== 鞄の計算 =====================
const nb=i=>{const c=i%COLS,r=Math.floor(i/COLS),o=[];if(r>0)o.push(i-COLS);if(r<ROWS-1)o.push(i+COLS);if(c>0)o.push(i-1);if(c<COLS-1)o.push(i+1);return o;};
const supV=(base,st)=>base*(1+0.35*(st-1));
// 職業ごとの鞄を戦闘用の一覧にする。party は前からの職業の並び。
function compileBag(bags,party){
  // simStage 等の旧呼び出しも読めるが、戦闘の隣接は職業ごとに閉じる。
  if(Array.isArray(bags))bags=migrateBags(bags,party);
  const out=[];
  party.forEach((own,hi)=>{const bag=bags[own]||[];
  bag.forEach((it,i)=>{if(!it)return;const D=ITEMS[it.id];if(D.kind==='sup')return;
    const o={slot:i,id:it.id,st:it.st,own,hi,kind:D.kind,cls:D.cls,el:D.el||'phys',D,p:D.p*STAR_MULT[it.st],cd:D.cd,mult:1,notes:[],echo:0};
    if(hi<0){o.off=1;out.push(o);return;}
    const aff=affOf(own,D.cls);o.mult*=AFF[aff];o.aff=aff;
    let empty=0,any=0;
    for(const n of nb(i)){const b=bag[n];if(!b){empty++;continue;}any++;const B=ITEMS[b.id];if(B.kind!=='sup')continue;
      if(B.sup==='pow'&&D.kind==='atk'){const v=supV(B.v,b.st);o.mult*=1+v;o.notes.push(`${B.nm}+${Math.round(v*100)}%`);}
      if(B.sup==='spd'&&D.kind==='atk'){const v=supV(B.v,b.st);o.cd/=1+v;o.notes.push(`${B.nm}で速い`);}
      if(B.sup==='care'&&(D.kind==='shield'||D.kind==='heal')){const v=supV(B.v,b.st);o.mult*=1+v;o.notes.push(`${B.nm}+${Math.round(v*100)}%`);}
      if(B.sup==='el'&&D.kind==='atk'&&D.el==='phys'){if(!o.stone||b.st>o.stone.st)o.stone={el:B.el,st:b.st,nm:B.nm};}
      if(B.sup==='echo')o.echo=1;}
    if(o.stone){o.el=o.stone.el;o.mult*=1.05+0.05*o.stone.st;o.notes.push(`${o.stone.nm}で${EL_NM[o.el]}`);}
    if(D.open&&empty>0){o.mult*=1.4;o.notes.push('空きで+40%');}
    if(D.alone&&any===0){o.mult*=2;o.notes.push('ひとりで2倍');}
    // 技
    const sk=id=>skRank(own,id);
    if(D.cls==='blade')o.mult*=1+sk('k_blade')*0.06;
    if(D.cls==='bow'){o.mult*=1+sk('a_dmg')*0.06;o.cd*=1-sk('a_spd')*0.03;}
    if(D.cls==='axe')o.mult*=1+sk('b_axe')*0.06;
    if(D.cls==='trap')o.mult*=1+sk('h_trap')*0.06;
    if(D.cls==='holy'&&D.kind==='atk')o.mult*=1+sk('p_holy')*0.06;
    if(D.kind==='atk'&&o.el!=='phys'&&own==='mage')o.mult*=1.15+sk('m_el')*0.06;
    if(D.kind==='shield')o.mult*=1+sk('k_guard')*0.08;
    if(D.kind==='heal'&&own==='priest')o.mult*=1.2+sk('p_heal')*0.06;
    if(own==='archer')o.cd/=1.15;
    o.mult*=heroPow(own);
    o.dps=D.kind==='atk'?o.p*o.mult/o.cd:0;
    out.push(o);});});
  return out;
}
// 次の面に対しての見込み（品ごとの1秒あたりの威力）
function resOf(foeK,el){const r=FOES[foeK].res[el];return r==null?1:r;}
function stageFoes(st){const set=[];for(const w of st.w)for(const f of w)if(!set.includes(f))set.push(f);return set;}

// 壁の面（強敵・ボス）は面全体を強くする。ふだんの面は着いたレベルで越えられ、壁で稼ぐ形にする
const WALL=s=>{const t=STAGES[s]&&STAGES[s].tag;const r=STAGES[s]?STAGES[s].ri:0;return t==='strong'||t==='boss'?((GROW.wallR&&GROW.wallR[r])||GROW.wall||1):(GROW.norm||1);};

  return{k,F,hp,max:hp,splitHP:fullHP-hp,atk,cd:F.cd,t:Math.random()*F.cd*0.5,alive:true,strong:!!strong||!!F.boss,boss:F.boss,anim:'idle',at:0,x:0,slot,burn:[],chill:0,rage:false,dead:0,healT:0,age:0,roleT:0,bar:0,charge:0};}
function startStage(s,opts={}){

  const party=S.party.slice();
  B={s,st,party,bagCounts:Object.fromEntries(party.map(j=>[j,S.bags[j].filter(Boolean).length])),items:compileBag(S.bags,party),heroes:party.map((j,i)=>makeHero(j,i)),foes:[],wi:-1,phase:'fight',run:true,gapT:0,endT:0,t:0,
    paused:false,gain:{xp:0,gold:0,drops:[]},fx:[],nums:[],seal:null,sealT:0,sim:!!opts.sim,

// 敵は右から歩いてくる。前の敵ほど左で止まる
// 帯が高い（iPadなど）ほどキャラも間隔も大きくする
const UK=()=>clamp(Math.min((CH||110)/110,(CW||390)/300),1,2.6);// 細い画面では横幅でも抑える（勇者が左で切れないように）
const ENG=i=>0.45+i*0.085;// 戦闘の計算に使うので画面の大きさに左右されない値にする
const foeStop=f=>ENG(Math.max(0,B.foes.filter(x=>x.alive).indexOf(f)));
function nextWave(){
  B.wi++;const w=B.st.w[B.wi];const last=B.wi===B.st.w.length-1;
  B.foes=B.foes.filter(f=>f.alive||f.at<1.2).concat(w.map((k,i)=>{const f=makeFoe(k,B.s,last&&B.st.last===k&&i===w.lastIndexOf(k),i);f.x=1.06+i*0.1;return f;}));
  B.items.forEach(o=>{if(o.D.first)o.armed=1;});
  if(!B.sim&&w.some(k=>FOES[k].boss)){banner(`${FOES[w.find(k=>FOES[k].boss)].nm}が現れた`,'#e0a0ff');sfx('foe');}
}
const sealedBag=()=>B.party.reduce((best,j)=>B.bagCounts[j]>B.bagCounts[best]?j:best,B.party[0]);
const RANGED=new Set(['bow','staff','holy','trap']);
function stepBattle(dt){
  if(!B||B.paused)return;
  for(const h of B.heroes)h.at+=dt;for(const f of B.foes)f.at+=dt;
  if(B.phase==='won'||B.phase==='lost'){B.endT+=dt;for(const f of B.foes)if(!f.alive)f.x-=dt*0.25;
    if(!B.sim&&B.endT>(B.phase==='won'?0.9:2.2)&&B.nextS!=null&&!B.preparing){const n=B.nextS,sum=B.keepSum?B.sum:null;B.nextS=null;startStage(n,{sum});}return;}
  B.t+=dt;
  let live=B.foes.filter(f=>f.alive);
  if(!live.length){if(B.wi>=B.st.w.length-1){endStage(true);return;}B.gapT+=dt;if(B.wi<0||B.gapT>0.3){B.gapT=0;nextWave();live=B.foes.filter(f=>f.alive);}}
  // 歩く
  let eng=false;
  for(const f of B.foes){if(!f.alive){if(B.run)f.x-=dt*0.25;continue;}const tx=foeStop(f);if(f.x>tx+0.001)f.x=Math.max(tx,f.x-dt*0.42);else eng=true;}
  B.run=!eng;
  // ---- 味方の装備 ----
  if(B.sealT>0){B.sealT-=dt;if(B.sealT<=0){B.seal=null;if(!B.sim)renderBagSeal();}}
  for(const o of B.items){if(o.off)continue;const h=B.heroes[o.hi];if(!h||!h.alive)continue;if(B.seal===o.own)continue;
    const can=hasTarget(o);if(o.armed&&can){o.armed=0;useItem(o,h,true);}
    o.t=Math.min(o.cd,o.t+dt);if(o.t>=o.cd&&can){o.t=0;useItem(o,h);if(o.D.twice&&++o.n%o.D.twice===0)useItem(o,h,true);if(o.echo&&++o.en%4===0)useItem(o,h,true);}}
  // ---- 敵 ----
  for(const f of B.foes){if(!f.alive)continue;
    if(f.burn.length){let d=0;f.burn=f.burn.filter(b=>{const x=Math.min(dt,b.t);d+=b.dps*x;b.t-=dt;return b.t>0;});if(d>0)hurtFoe(f,d,'fire',true);if(!f.alive)continue;}
    if(f.chill>0)f.chill-=dt;
    if(f.x>foeStop(f)+0.001)continue;// まだ歩いている
    if(f.boss&&!f.rage&&(f.boss==='rage'||f.boss==='king')&&f.hp<f.max*0.5){f.rage=true;if(!B.sim){banner(`${f.F.nm}が怒った（攻撃1.5倍）`,'#ff8a6a');sfx('foe');}}
    if(f.boss==='seal'||f.boss==='king'){f.healT+=dt;if(f.healT>=8){f.healT=0;B.seal=sealedBag();B.sealT=4;if(!B.sim){banner(`${f.F.nm}が${JOBS[B.seal].nm}の鞄を止めた`,'#c79aff');sfx('freeze');renderBagSeal();}}}
    f.age+=dt;f.roleT+=dt;
    if(f.F.tr==='summon'&&f.roleT>=6){f.roleT=0;const children=B.foes.filter(x=>x.alive&&x.parent===f);if(children.length<2&&f.hp>f.max*.12){const hp=Math.min(f.hp-1,f.max*.08);f.hp-=hp;spawnSmall(f,hp,f.atk*.1);if(!B.sim)banner('小さな仲間を呼んだ','#c8b5ff');}}
    if(f.F.tr==='shield'&&f.roleT>=4){f.roleT=0;for(const a of B.foes)if(a.alive&&a!==f)a.bar=Math.min(f.atk*.9,(a.bar||0)+f.atk*.45);if(!B.sim){combatAction(`${f.F.nm}が仲間に盾を張った`,'danger');sfx('shield');}}
    if(f.F.tr==='focus'){
      if(f.charge>0){f.charge-=dt;if(f.charge<=0)foeAct(f);continue;}
      f.t+=dt*(f.chill>0?.6:1);if(f.t>=f.cd){f.t=0;f.charge=f.cd;}continue;
    }
    f.t+=dt*(f.chill>0?0.6:1);
    if(f.t>=f.cd){f.t-=f.cd;foeAct(f);}}
  if(B.heroes.every(h=>!h.alive))endStage(false);
}
// 近接は目の前の敵だけ、弓・杖は見えている敵を撃てる
function hasTarget(o){if(o.kind==='heal')return B.heroes.some(h=>h.alive&&h.hp<h.max);if(o.kind==='shield')return B.foes.some(f=>f.alive&&f.x<0.97);
  return !!targetOf(o);}
function targetOf(o){return B.foes.find(f=>f.alive&&(RANGED.has(o.cls)?f.x<0.97:f.x<=foeStop(f)+0.001));}
function useItem(o,h,extra){
  h.anim='attack';h.at=0;o.flash=0.18;if(o.kind==='atk'&&!RANGED.has(o.cls)){h.strikeAt=B.t;h.melee=true;}
  if(o.kind==='atk'){
    const t0=targetOf(o);if(!t0)return;const tg=o.D.aoe?B.foes.filter(f=>f.alive&&f.x<0.97):[t0];
    let m=o.mult;if(h.j==='berserker')m*=1+(0.4+skRank('berserker','b_rage')*0.06)*(1-h.hp/h.max);
    let crit=(o.D.crit||0)+(h.j==='archer'?skRank('archer','a_crit')*0.02:0);const isCrit=Math.random()<crit;if(isCrit)m*=2;
    for(const f of tg){let d=o.p*m*resOf(f.k,o.el);
      if(f.F.tr==='armor'&&!o.D.pierce)d*=0.55;
      if(o.D.exec&&f.hp<f.max*0.3)d*=2;
      if(f.strong){if(o.D.strong)d*=1.5;if(h.j==='hunter')d*=1.15+skRank('hunter','h_beast')*0.05;}
      B.dealt.n++;B.dealt.res+=resOf(f.k,o.el);
      if(f.F.tr==='thorns'&&!RANGED.has(o.cls)){hitHero(h,Math.min(d*.18,f.atk*.3),false,{f,label:'反撃（近接に反応）'});f.thornAt=B.t;}
      f.visualDelay=!B.sim&&RANGED.has(o.cls)?.25:0;hurtFoe(f,d,o.el,false,isCrit);
      if(o.el==='fire')f.burn.push({dps:d*0.4*(1+skRank(h.j,'m_burn')*0.1)/3,t:3});
      if(o.el==='ice')f.chill=Math.max(f.chill,2*(1+skRank(h.j,'m_chill')*0.1));
      if(o.el==='thun'){const o2=B.foes.find(x=>x.alive&&x!==f);if(o2&&o2.x<0.97)hurtFoe(o2,d*0.5*(1+skRank(h.j,'m_chain')*0.08),'thun');}
      if(h.j==='berserker'){const lr=skRank('berserker','b_leech')*0.01;if(lr)healHero(h,d*lr,true);}}
    if(!B.sim){combatAction(`${JOBS[h.j].nm}の${ITEMS[o.id].nm}が${tg[0].F.nm}に${EL_NM[o.el]}攻撃`,'ally');shot(o,h,tg[0],isCrit);}
  }else if(o.kind==='shield'){const v=o.p*o.mult;h.bar=Math.min(h.max*0.8,h.bar+v);if(!B.sim){combatAction(`${JOBS[h.j].nm}が${ITEMS[o.id].nm}でバリア`,'ally');numAt(heroX(h.idx),0.42,`+${Math.round(v)}`,'#7fc3ff');sfx('shield');}
    if(o.D.mirror){for(const f of B.foes)if(f.alive)hurtFoe(f,v*0.5,'phys');}}
  else if(o.kind==='heal'){const v=o.p*o.mult;const tg=o.D.all?B.heroes.filter(x=>x.alive):[B.heroes.filter(x=>x.alive).sort((a,b)=>a.hp/a.max-b.hp/b.max)[0]].filter(Boolean);
    for(const t of tg){const got=healHero(t,v);if(!B.sim&&o.cls==='holy')B.fx.push({type:'shot',cls:'holy',x0:heroDrawX(t),x1:heroDrawX(t),y0:0,y1:heroY(t.idx)-12,t:0,d:.25,col:'#fff1af',arc:0});const pb=skRank(h.j,'p_bar')*0.03;if(pb&&got>0)t.bar=Math.min(t.max*0.8,t.bar+got*pb);}if(!B.sim){combatAction(`${JOBS[h.j].nm}の${ITEMS[o.id].nm}で${tg.map(t=>JOBS[t.j].nm).join('と')}を回復`,'ally');sfx('heal');}}
}
function healHero(h,v,quiet){const got=Math.min(h.max-h.hp,v);h.hp+=got;if(!B.sim&&!quiet&&got>=1)numAt(heroX(h.idx),0.5,`+${Math.round(got)}`,'#8fe07a');return got;}
function hurtFoe(f,d,el,dot,crit){if(!f.alive)return;if(f.bar>0){const a=Math.min(d,f.bar);f.bar-=a;d-=a;}f.hp-=d;if(!B.sim&&!dot){f.anim='hit';f.at=0;f.hitAt=B.t+(f.visualDelay||0);const highlight=!!crit||!!f.boss||d>f.max*.18||f.hp<=0;if(highlight)numAt(f.x,0.37,Math.round(d),EL_COL[el],!!crit||f.hp<=0,f.visualDelay||0);}
  if(f.hp<=0){f.hp=0;f.alive=false;f.anim='death';f.at=0;killFoe(f);}}
const EL_COL={phys:'#f3e9d8',fire:'#ff8a5a',ice:'#8fd8ff',thun:'#ffe066'};
function foeAct(f){
  f.anim='attack';f.at=0;
  if(f.F.tr==='heal'&&Math.random()<0.5){const t=B.foes.filter(x=>x.alive).sort((a,b)=>a.hp/a.max-b.hp/b.max)[0];if(t&&t.hp<t.max){t.hp=Math.min(t.max,t.hp+t.max*0.12);if(!B.sim)numAt(t.x,0.5,'回復','#8fe07a');return;}}

  for(const h of tg)hitHero(h,atk,f.F.tr==='toxic',{f,label});

function hitHero(h,d,toxic,source){

  if(h.j==='archer'&&Math.random()<skRank('archer','a_eva')*0.02){if(!B.sim){numAt(heroX(h.idx),0.5,'よけた','#cfc4b0');recordHit(h,source,0,0,true);}return;}
  if(h.j==='knight'&&h.idx===firstAliveIdx())d*=0.85;
  const kn=B.heroes.find(x=>x.j==='knight'&&x.alive&&x.idx===firstAliveIdx());if(kn&&kn!==h)d*=1-skRank('knight','k_cover')*0.02;

  h.hp-=d;h.anim='hit';h.at=0;if(!B.sim&&d>0.5){if(toxic||d>h.max*.18||h.hp<=0)numAt(heroX(h.idx),0.55,Math.round(d),toxic?'#b48aff':'#ff6a5a',h.hp<=0);sfx('hurt');}
  if(h.hp<=0){h.hp=0;h.alive=false;h.anim='death';h.at=0;
    const pr=B.heroes.find(x=>x.j==='priest'&&x.alive);const r=pr?skRank('priest','p_rev'):0;
    if(pr&&r&&!B.revUsed){B.revUsed=1;h.alive=true;h.hp=h.max*r*0.03;h.anim='idle';if(!B.sim)banner(`祈りで${JOBS[h.j].nm}が起き上がった`,'#ffe9a8');}}
}
// 表示用の記録。防御と被害を同じ攻撃・同じ受け手に閉じる。
function recordHit(h,source,blocked,damage,evaded){const event={serial:B.hitSerial=(B.hitSerial||0)+1,source:source?.f.F.nm||null,target:h.j,label:source?.label||'被害',blocked,damage,evaded,until:performance.now()+2800};B.attackEvent=event;h.impact={...event,at:B.t};if(source)source.f.attackTarget={j:h.j,at:B.t,evaded,serial:event.serial};const defense=evaded?'よけた':`${blocked>0?'バリアが'+Math.round(blocked)+'防いだ。':''}被害${Math.round(damage)}`;combatAction(`${event.source?event.source+'の'+event.label+'。':'直前の防御。'}${JOBS[h.j].nm}：${defense}`,'danger');}
const firstAliveIdx=()=>{const h=B.heroes.find(x=>x.alive);return h?h.idx:-1;};
// 小敵に追加の経験値・お金・落とし物は付けない。

const ROLE_ADVICE={focus:'前衛に溜め攻撃。騎士に盾を2つ持たせよう',grow:'長引くと育つ敵。武器の隣に砥石を置いて早く倒そう',summon:'仲間を呼ぶ敵。武器を増やして呼び手を早く倒そう',thorns:'近接に反撃する敵。弓と杖で攻めよう',shield:'仲間に盾を張る敵。盾持ちを先に倒せるよう攻撃を増やそう',split:'倒すと分裂する敵。全員を攻撃する武器や雷で小敵をまとめて倒そう',armor:'硬い殻の敵。殻を無視する鉄の棍棒や戦槌を使おう',back:'後ろを狙う敵。後ろの仲間にも盾を持たせよう',aoe:'全員を攻撃する敵。祈りの書や霊薬で全員を回復しよう',heal:'仲間を回復する敵。武器や砥石で攻撃を増やそう',fast:'すばやい敵。前衛に盾と薬を持たせよう',toxic:'盾をすり抜ける毒の敵。薬で回復しよう'};
function loseWhy(){
  const st=B.st,out=[];const avg=B.dealt.n?B.dealt.res/B.dealt.n:1;
  const foes=stageFoes(st);
  for(const role of new Set(foes.map(k=>FOES[k].tr).filter(Boolean)))if(ROLE_ADVICE[role])out.push(ROLE_ADVICE[role]);
  const best=ELS.map(el=>[el,foes.reduce((a,k)=>a+resOf(k,el),0)/foes.length]).sort((a,b)=>b[1]-a[1]);
  if(avg<0.85)out.push(`攻撃が効きにくかった（平均${avg.toFixed(2)}倍）。この面には<b>${EL_NM[best[0][0]]}</b>がよく効く。${best[0][0]==='phys'?'砥石で物理を強く':`${({fire:'火の石',ice:'氷の石',thun:'雷の石'})[best[0][0]]}を武器の隣に`}`);



  if(st.tag==='boss'&&(FOES[st.w[st.w.length-1][0]].boss==='seal'||FOES[st.w[st.w.length-1][0]].boss==='king'))out.push('ボスは品の一番多い勇者の鞄を4秒止める。ほかの勇者の鞄も整えよう');

  if(!out.length)out.push('あと少し。前の面を周回してレベルを上げるか、品を合わせて段階を上げる');
  return out;
}

let AC=null,MASTER=null;const SAMP={},BGMB={};const LAST={};
const SAMPLE_FILES={tick:1,open:1,err:1,buy:1,coin:1,reroll:2,merge:1,rare:1,place:1,placeW:2,placeG:2,slash:2,heavy:1,hit:3,hurt:2,foe:2,block:2,shield:1,freeze:2,heal:1,special:1};
const SAMPLE_VOL={tick:.5,open:.6,err:.6,buy:.5,coin:.35,reroll:.6,merge:.55,rare:.55,place:.45,placeW:3,placeG:.5,slash:.45,heavy:.6,hit:.45,hurt:.45,foe:.4,block:.5,shield:.45,freeze:.6,heal:.5,special:.7};
const GAP={coin:0.08,hit:0.05,slash:0.07,arrow:0.07,magic:0.09,heavy:0.08,shield:0.1,heal:0.12,foe:0.12,hurt:0.1,block:0.1,crit:0.1};
function audio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();MASTER=AC.createGain();MASTER.gain.value=0.7;MASTER.connect(AC.destination);loadSamples();}catch(e){}}
function loadSamples(){const get=f=>fetch(srcOf(SFXP+f)).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer();}).then(b=>AC.decodeAudioData(b));
  for(const [k,n] of Object.entries(SAMPLE_FILES))for(let i=0;i<n;i++)get(`${k}_${i}.m4a`).then(buf=>{(SAMP[k]=SAMP[k]||[]).push(buf);}).catch(()=>{});
  for(const k of ['home','shop','battle','boss'])get(`bgm_${k}.m4a`).then(buf=>{BGMB[k]=buf;if(BGM.want===k){BGM.cur=null;setMusic(k);}}).catch(()=>{});}
function tone(type,f0,f1,dur,vol,t){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(MASTER);o.start(t);o.stop(t+dur+0.02);}
function sfx(kind){if(S.muted||!kind||(B&&B.sim))return;audio();if(!AC)return;if(AC.state!=='running')AC.resume();const t=AC.currentTime+0.005;
  if(GAP[kind]&&LAST[kind]&&t-LAST[kind]<GAP[kind]/Math.max(1,S.spd*0.6))return;LAST[kind]=t;
  const map={arrow:'slash',magic:'freeze',crit:'hit',win:'special',lose:'err'};const list=SAMP[kind]||SAMP[map[kind]];
  if(list&&list.length&&kind!=='magic'){const s=AC.createBufferSource(),g=AC.createGain();s.buffer=pick(list);s.playbackRate.value=1+(Math.random()-.5)*0.08;g.gain.value=SAMPLE_VOL[kind]||SAMPLE_VOL[map[kind]]||.5;s.connect(g);g.connect(MASTER);s.start(t);return;}
  switch(kind){case'arrow':tone('triangle',980,620,0.05,0.12,t);break;case'magic':tone('sine',520,1180,0.18,0.1,t);break;
    case'win':[523,659,784,1047].forEach((f,i)=>tone('square',f,f,0.12,0.08,t+i*0.09));break;case'lose':[392,330,262].forEach((f,i)=>tone('triangle',f,f*0.97,0.22,0.16,t+i*0.16));break;
    default:tone('square',880,880,0.04,0.04,t);}}
const BGM={cur:null,want:null,src:null,g:null};
function setMusic(k){BGM.want=k;if(S.muted||!AC||BGM.cur===k)return;const buf=BGMB[k];if(!buf)return;

function recoveryAction(n){const keys=stashKeys('all'),foes=stageFoes(STAGES[n.s]),front=S.party[0],roles=foes.map(k=>FOES[k].tr);
  if(roles.some(r=>r==='focus'||r==='fast')&&S.bags[front].filter(it=>it&&ITEMS[it.id].kind==='shield').length<2){const shields=keys.filter(k=>ITEMS[k.split('|')[0]].kind==='shield').map(key=>({key,rec:placementFor(key,front,true)})).filter(x=>x.rec.gain>.01).sort((a,b)=>b.rec.gain-a.rec.gain);if(shields.length){const a=shields[0];return {key:a.key,job:front,text:ITEMS[a.rec.it.id].nm+'を'+JOBS[front].nm+'に'};}}
  const best=ELS.slice().sort((a,b)=>foes.reduce((v,k)=>v+resOf(k,b)-resOf(k,a),0))[0];
  const ranks=keys.map(key=>{const [id]=key.split('|'),D=ITEMS[id],rec=placementFor(key);let score=rec.net;if(D.sup==='el'&&D.el===best)score+=20;if(D.sup==='pow')score+=5;return {key,rec,score};}).filter(x=>x.rec.net>.01).sort((a,b)=>b.score-a.score);

function recoveryEstimate(s,left){const list=lapTimes.get(s);if(!list?.length)return null;const mean=list.reduce((a,b)=>a+b,0)/list.length;return Math.max(0,left*mean-(B?.s===s&&B.phase==='fight'?B.t:0))/S.spd;}

  }else if(SEL?.from==='bag'){saveBagUndo(ITEMS[S.bags[SEL.j][SEL.i].id].nm+(it?'との入れ替えを戻す':'の移動を戻す'));const src=S.bags[SEL.j];[src[SEL.i],bag[i]]=[bag[i],src[SEL.i]];

  finishBagUndo();const reward=activeReward||rewardBatch.find(r=>!r.placed&&bag[i]&&r.id===bag[i].id&&r.st===bag[i].st);if(reward){reward.placed=true;activeReward=null;persistRewards();}
  tutorialTick();sfx('place');refreshBattle();setSel(null);save();renderBag();renderStash2();renderRewardQueue();showEquipChange(before,j,i);if(source){const c=document.querySelector(`#bag [data-j="${source.j}"][data-i="${source.i}"]`);c?.classList.add('just-equipped');setTimeout(()=>c?.classList.remove('just-equipped'),1400);}renderTutorial();

function refreshBattle(){

  B.items=compileBag(S.bags,S.party).map(o=>{const prev=old.find(x=>x.own===o.own&&x.slot===o.slot&&x.id===o.id&&x.st===o.st);return Object.assign(o,prev?{t:Math.max(0,o.cd-(prev.cd-prev.t)),n:prev.n,en:prev.en,armed:prev.armed,flash:prev.flash}:{t:0,n:0,en:0});});
}

function itemLines(it,comp){const D=ITEMS[it.id];const out=[];

    if(o&&o.el!=='phys')out.push(EL_FX[o.el]);}
  else if(D.kind==='shield'){const p=comp?comp.p*comp.mult:D.p*STAR_MULT[it.st];out.push(`盾：持ち主にバリア <b>${Math.round(p)}</b>／${D.cd}秒（バリア／秒 ${(p/D.cd).toFixed(1)}）`);}

  else out.push(`${CLS_NM[D.cls]}（置くだけ）：${D.txt}${it.st>1&&D.v?`（${STAR_NM[it.st]}で${Math.round(supV(D.v,it.st)*100)}%）`:''}`);
  const sp=[];if(D.first)sp.push('波の始めにすぐ1回');if(D.aoe)sp.push('敵全員に当たる');if(D.pierce)sp.push('硬い殻を無視');if(D.exec)sp.push('敵のHPが3割以下なら2倍');if(D.crit)sp.push(`会心${Math.round(D.crit*100)}%`);if(D.twice)sp.push(`${D.twice}回に1回もう一度`);if(D.open)sp.push('上下左右に空きがあると+40%');if(D.strong)sp.push('強敵・ボスに+50%');if(D.alone)sp.push('上下左右に何もないと2倍');if(D.mirror)sp.push('バリアを張ると敵全員に半分のダメージ');if(D.all&&D.kind==='heal')sp.push('全員を回復');
  if(sp.length)out.push(sp.join('・'));

function renderInfo(){const el=$('info');if(!el)return;const key=SEL?.from==='stash'&&S.stash[SEL.key]>0?SEL.key:null;if(!key){el.innerHTML='';return;}const rec=placementFor(key,SEL.job,!!SEL.job),D=ITEMS[rec.it.id];

// 配置の候補を既存の compileBag で評価する。戦闘値そのものは変更しない。
function rateOf(o){return o&&!o.off?(o.p*o.mult/o.cd):0;}
function bagRates(bags,j){const c=compileBag(bags,j?[j]:S.party);return {atk:c.filter(o=>o.kind==='atk').reduce((n,o)=>n+rateOf(o),0),shield:c.filter(o=>o.kind==='shield').reduce((n,o)=>n+rateOf(o),0),heal:c.filter(o=>o.kind==='heal').reduce((n,o)=>n+rateOf(o),0)};}
function protectionJob(kind){const heroes=B?.heroes||S.party.map((j,idx)=>({j,idx,hp:heroMaxHP(j),max:heroMaxHP(j),alive:true}));return heroes.filter(h=>h.alive).sort((a,b)=>kind==='heal'?a.hp/a.max-b.hp/b.max||a.idx-b.idx:a.idx-b.idx)[0];}
function placementFor(key,job,allowTradeoff=false){const [id,st]=key.split('|'),D=ITEMS[id],it={id,st:+st},metric=D.kind==='sup'?(D.sup==='care'?'care':'atk'):D.kind;
  const score=v=>metric==='care'?v.shield+v.heal:v[metric];let best=null;
  for(const j of job?[job]:S.party){const before=bagRates(S.bags,j),base=score(before);for(let i=0;i<BAG_N;i++){const bags={...S.bags,[j]:S.bags[j].slice()};bags[j][i]=it;const after=bagRates(bags,j),value=score(after),gain=value-base,o=compileBag(bags,[j]).find(o=>o.slot===i);
    const deltas=Object.fromEntries(['atk','heal','shield'].map(k=>[k,after[k]-before[k]]));
    const old=S.bags[j][i],protect=!allowTradeoff&&old&&j===S.party[0]&&['shield','heal'].includes(ITEMS[old.id].kind)&&ITEMS[old.id].kind!==D.kind;
    const lost=Object.entries(deltas).filter(([k])=>metric==='care'?k==='atk':k!==metric).reduce((n,[k,v])=>n+Math.max(0,-v),0),net=gain-lost,rank=(allowTradeoff?gain:net)-(protect?1000:0)+(S.bags[j][i]?0:1e-6)+(gain>0&&net>0&&['heal','shield'].includes(D.kind)&&j===protectionJob(D.kind)?.j?100:0);
    if(!best||rank>best.rank)best={j,slot:i,it,o,gain,rank,net,base,value,before,after,deltas};}}
  return best;
}

function stashKeys(filter){const keys=Object.keys(S.stash).filter(k=>S.stash[k]>0);const kindOf=k=>ITEMS[k.split('|')[0]].kind;
  const f=filter||'all';const ok=k=>f==='all'||(f==='atk'&&kindOf(k)==='atk')||(f==='def'&&(kindOf(k)==='shield'||kindOf(k)==='heal'))||(f==='sup'&&kindOf(k)==='sup');
  const list=keys.filter(ok);const ord=Object.keys(ITEMS);

function loadSet(i){partyUndo=null;const set=S.sets[i];if(!set)return;saveBagUndo();
  const jobs=set.party.filter(j=>S.unlocked[j]);if(jobs.length!==3)return;
  const pool={...S.stash};for(const j of jobs)for(const it of S.bags[j])if(it){const k=it.id+'|'+it.st;pool[k]=(pool[k]||0)+1;}
  let miss=0;for(const j of jobs)S.bags[j]=(set.bags[j]||Array(BAG_N).fill(null)).map(it=>{if(!it)return null;const k=it.id+'|'+it.st;if(pool[k]>0){pool[k]--;return {...it};}miss++;return null;});
  S.party=jobs.slice();S.stash=Object.fromEntries(Object.entries(pool).filter(([k,v])=>v>0));finishBagUndo();refreshBattle();sfx('place');toast(miss?`呼び出した（${miss}個は持ち物に足りなかった）`:'3人の鞄を呼び出した');save();}

function arrangePlan(stage){const foes=stageFoes(STAGES[stage]),res=el=>foes.reduce((a,k)=>a+resOf(k,el),0)/foes.length,L=[];
  for(const k in S.stash)for(let i=0;i<S.stash[k];i++){const [id,st]=k.split('|');L.push({id,st:+st});}
  S.party.forEach(j=>S.bags[j].forEach(x=>{if(x)L.push({id:x.id,st:x.st});}));
  const used=new Set(),bags=copyBags(S.bags),put=(j,slot,it)=>{bags[j][slot]={...it};used.add(it);};S.party.forEach(j=>bags[j]=Array(BAG_N).fill(null));
  const score=(it,j)=>{const D=ITEMS[it.id];return (D.p||0)*STAR_MULT[it.st]/(D.cd||1)*AFF[affOf(j,D.cls)]*(D.kind==='atk'?res(D.el):1);};
  L.filter(it=>ITEMS[it.id].kind==='shield').sort((a,b)=>score(b,S.party[0])-score(a,S.party[0])).slice(0,2).forEach((it,i)=>put(S.party[0],i*3,it));
  const heals=L.filter(it=>ITEMS[it.id].kind==='heal').sort((a,b)=>Math.max(...S.party.map(j=>score(b,j)))-Math.max(...S.party.map(j=>score(a,j))));
  if(heals[0]){const j=S.party.slice().sort((a,b)=>score(heals[0],b)-score(heals[0],a))[0];put(j,5,heals[0]);}
  for(let n=0;n<18;n++){let best=null;for(const it of L){if(used.has(it)||ITEMS[it.id].kind!=='atk')continue;for(const j of S.party){const slot=bags[j].indexOf(null);if(slot<0)continue;const v=score(it,j);if(!best||v>best.v)best={it,j,slot,v};}}if(!best)break;put(best.j,best.slot,best.it);}
  const value=bs=>compileBag(bs,S.party).reduce((n,o)=>n+rateOf(o)*(o.kind==='atk'?res(o.el):o.kind==='shield'?.75:.8),0);
  for(const it of L.filter(it=>ITEMS[it.id].kind==='sup').sort((a,b)=>b.st-a.st)){
    let best=null,base=value(bags);for(const j of S.party)for(let i=0;i<BAG_N;i++){const old=bags[j][i];if(old&&ITEMS[old.id].kind!=='atk')continue;// 盾と薬は外さない
      bags[j][i]=it;const gain=value(bags)-base;bags[j][i]=old;if(gain>0&&(!best||gain>best.gain))best={j,i,old,gain};}
    if(best){if(best.old){const match=[...used].find(x=>x.id===best.old.id&&x.st===best.old.st);if(match)used.delete(match);}put(best.j,best.i,it);}
  }
  const stash={};for(const it of L)if(!used.has(it)){const k=it.id+'|'+it.st;stash[k]=(stash[k]||0)+1;}
  return {bags,stash};
}

function partyComparison(before,after){return [['atk','攻撃／秒'],['heal','回復／秒'],['shield','バリア／秒']].map(([k,n])=>`<div>${n} <b>${before[k].toFixed(1)}</b> から <b class="${after[k]>=before[k]?'good':'bad'}">${after[k].toFixed(1)}</b></div>`).join('');}
function previewParty(i,j){const outgoing=S.party[i],party=S.party.slice(),existing=party.indexOf(j);if(existing>=0)party[existing]=outgoing;party[i]=j;
  const empty=S.bags[j].every(x=>!x),before=partyRates(S.party),after=partyRates(party),inherited=copyBags(S.bags);inherited[j]=inherited[outgoing];inherited[outgoing]=Array(BAG_N).fill(null);
  const apply=transfer=>{bagUndo=null;bagUndoReason='隊を入れ替えたため、前の配置には戻せない';partyUndo={party:S.party.slice(),bags:copyBags(S.bags)};if(transfer){S.bags[j]=S.bags[outgoing];S.bags[outgoing]=Array(BAG_N).fill(null);}S.party=party;refreshBattle();setSel(null);save();closeModal();renderAll();feed('隊を入れ替えた。勇者の画面ですぐ戻せる');};
  modal(`<h2>${JOBS[outgoing].nm}から${JOBS[j].nm}へ</h2><p>${JOBS[j].ps}</p><h3>入る勇者の鞄</h3><div class="preview-bag">${S.bags[j].map(it=>`<div class="slot">${it?itemHTML(it):''}</div>`).join('')}</div>${empty?'<p>この勇者は品を持っていない。薬を置くと回復できる。</p>':''}<div class="compare">${partyComparison(before,after)}</div>${empty&&existing<0?`<div class="compare"><b>品を引き継いだ場合</b>${partyComparison(before,partyRates(party,inherited))}</div>`:''}<div class="row"><button class="btn" data-x>やめる</button><button class="btn" id="partyApply">入れ替える</button>${empty&&existing<0?'<button class="btn go" id="partyTransfer">出る勇者の品を引き継ぐ</button>':''}</div>`);
  $('partyApply').onclick=()=>apply(false);if($('partyTransfer'))$('partyTransfer').onclick=()=>apply(true);
}

function renderHeroes(m){const j0=HSEL||S.party[0],J=JOBS[j0],pts=skPoints(j0),skillIcons={knight:['heart','shield','ironwall','sword'],archer:['spring','hawkeye','bow','feather'],mage:['orb','fire','ice','storm'],priest:['potion','wardbell','lantern','renewal'],hunter:['spiked','fang','coins','chest'],berserker:['axe','blood','vampdagger','heart']};
  m.innerHTML=`<div class="win"><div class="wt">${J.nm}</div><div class="hero-sheet"><div class="hero-art">${sprBox(J.spr,104,false)}</div><div><h2>${J.nm}</h2><p>${J.ps}</p><p>HP ${heroMaxHP(j0)}<br>攻撃 ${(heroPow(j0)*100).toFixed(0)}%</p></div></div><div class="party-slots">${S.party.map((j,i)=>`<button data-slot="${i}" class="${j===j0?'selected':''}"><small>${['前','中','後ろ'][i]}</small>${faceBox(j,37)}<div>${JOBS[j].nm}</div></button>`).join('')}</div><p class="item-hint">職業を選び、隊の枠を押すと入れ替え前に比べられる</p>${partyUndo?'<button class="btn" id="partyUndo">入れ替えを元に戻す</button>':''}</div><div class="win"><div class="wt">職業</div><div class="job-row">${JOB_ORDER.map(j=>`<button data-j="${j}" class="${j===j0?'selected':''}" aria-label="${S.unlocked[j]?JOBS[j].nm:'未開放 '+STAGES[JOB_UNLOCK[j]].nm+'で仲間になる'}" ${S.unlocked[j]?'':'disabled'}>${faceBox(j,34)}<small>${S.unlocked[j]?JOBS[j].nm:'未開放'}</small></button>`).join('')}</div></div><div class="win"><div class="wt">技 <small>ポイント ${pts}</small></div><div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="skill-points">使えるポイント ${pts}</span><button class="btn sm" id="hReset">振り直す</button></div><div class="skill-grid">${J.sk.map(([id,nm,ds,per],i)=>{const r=skRank(j0,id);return `${i%2===0?`<div class="skill-tier">${i===0?'一段目':'二段目'}</div>`:''}<button class="skill-tile" data-sk="${id}"><img src="${ICO(skillIcons[j0][i])}" alt=""><span><small>技 ${i+1}</small><b>${nm}</b><small>${r} / ${SK_MAX}</small></span></button>`;}).join('')}</div><p class="item-hint">技を押すと効果と強化。振り直しは無料。</p></div>`;
  m.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{HSEL=b.dataset.j;sfx('tick');renderHeroes(m);});
  m.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{const i=+b.dataset.slot,j=HSEL;if(!j||S.party[i]===j){HSEL=S.party[i];renderHeroes(m);return;}previewParty(i,j);});
  if($('partyUndo'))$('partyUndo').onclick=()=>{S.party=partyUndo.party;S.bags=partyUndo.bags;partyUndo=null;refreshBattle();save();renderAll();feed('前の隊と鞄に戻した');};
  m.querySelectorAll('[data-sk]').forEach(b=>b.onclick=()=>{const id=b.dataset.sk,skill=J.sk.find(x=>x[0]===id),r=skRank(j0,id);modal(`<h2>${skill[1]}</h2><p>${skill[2]}</p><p class="sub">段階 ${r} / ${SK_MAX} ・ポイント ${skPoints(j0)}</p><div class="row"><button class="btn" data-x>閉じる</button><button class="btn go" id="learnSkill" ${pts>0&&r<SK_MAX?'':'disabled'}>1ポイントで上げる</button></div>`);$('learnSkill').onclick=()=>{if(skPoints(j0)<=0||skRank(j0,id)>=SK_MAX)return;S.sk[j0][id]=skRank(j0,id)+1;refreshBattle();sfx('tick');save();closeModal();renderHeroes(m);};});
  $('hReset').onclick=()=>{S.sk[j0]={};refreshBattle();sfx('reroll');save();renderHeroes(m);};
}
// ---------- 窓 ----------
let modalFocus=null;
function modal(h){if(!modalOpen())modalFocus=document.activeElement;$('mcard').innerHTML=h;$('modal').classList.add('on');$('mcard').setAttribute('role','dialog');$('mcard').setAttribute('aria-modal','true');$('mcard').setAttribute('aria-label',$('mcard').querySelector('h2,.item-title')?.textContent.replace('閉じる','')||'確認');$('mcard').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>closeModal());$('mcard').querySelector('button:not(:disabled)')?.focus({preventScroll:true});}
function closeModal(keep=false){$('modal').classList.remove('on');if(keep!==true){setSel(null);renderBag();renderStash2();renderTutorial();}if(modalFocus?.isConnected)modalFocus.focus({preventScroll:true});}
const modalOpen=()=>$('modal').classList.contains('on');
function confirmBox(t){return window.confirm(t);}
function gainCounts(c){return `<div class="gain">${Object.entries(c).map(([k,n])=>{const [id,st]=k.split('|');return `<div class="g" title="${ITEMS[id].nm} ${STAR_NM[st]} ${n}個">${itemHTML({id,st:+st})}<span class="num">${n>1?'×'+n:''}</span></div>`;}).join('')}</div>`;}
function gainGrid(drops){const c={};drops.forEach(d=>{const k=d.id+'|'+d.st;c[k]=(c[k]||0)+1;});return gainCounts(c);}
function showMenu(){modal(`<h2>その他</h2>
  <p class="sub">遊び方：面は自動で進む。勝つと次の面へ。勝てない面は前の面を周回してレベルを上げるか、敵に効く属性の石を武器の隣に置く。通常の落とし物は倉庫へ。強敵と初回報酬の宝箱は、鞄の画面で開ける。</p>
  <p class="sub">勝った数 ${S.stats.wins}・負けた数 ${S.stats.loses}・倒した敵 ${S.stats.kills}</p>
  <div class="row" style="flex-wrap:wrap"><button class="btn" id="tutOffMenu">案内を消す</button><button class="btn" id="mReset">最初からやり直す</button><button class="btn go" data-x>閉じる</button></div>
  <div class="credit" style="color:#6a5236">素材：キャラの絵 LuizMelo（CC0。狩人は Huntress、僧侶は Wizard Pack の色違い）／装備アイコン Shikashi's Fantasy Icons・Matt Firth (shikashipx)（CC BY 4.0）／背景 Codex の画像生成／効果音 Kenney「RPG Audio」「Impact Sounds」「Interface Sounds」（CC0）／曲 Juhani Junkala「Chiptune Adventures」（CC0）</div>`);
  $('tutOffMenu').onclick=()=>{S.tut.off=true;S.tut.preparing=false;if(B)B.preparing=false;save(true);closeModal();renderTutorial();};
  $('mReset').onclick=()=>{if(!confirmBox('セーブを消して最初からやり直す？（元に戻せない）'))return;localStorage.removeItem(SAVE_KEY);location.reload();};}

// ===================== 起動 =====================
async function boot(){
  $('modal').onclick=e=>{if(e.target===$('modal'))closeModal();};
  document.addEventListener('keydown',e=>{if(!modalOpen())return;if(e.key==='Escape'){closeModal();return;}if(e.key==='Tab'){const bs=[...$('mcard').querySelectorAll('button:not(:disabled),select,[tabindex="0"]')];if(!bs.length)return;const first=bs[0],last=bs[bs.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
  load();rewardBatch=S.rewards||[];reconcileRewards();notesExpanded=!!S.notes?.some(n=>n.kind==='off');syncUnlocks(true);sizeStage();addEventListener('resize',()=>{sizeStage();});new ResizeObserver(()=>sizeStage()).observe($('stage'));
  renderAll();
  await preload();
  const o=offlineGain();if(o){setNotice({kind:'off',o});refreshBattle();renderAll();}
  requestAnimationFrame(frame);
  setInterval(()=>{if(S.tab==='adv'&&B)renderParty();syncUnlocks();tutorialTick();renderTop();renderRecovery();renderChestBar();renderEquipFeedback();},500);
  document.addEventListener('visibilitychange',()=>{if(document.hidden){S.last=Date.now();save(true);}else{const o=offlineGain();if(o){if(o.sec>120)setNotice({kind:'off',o});refreshBattle();renderAll();}}});
  addEventListener('pointerdown',()=>{audio();if(!S.muted&&!BGM.cur)setMusic(B?REGIONS[B.st.ri].song:'home');},{once:true});
  // 前に遊んでいたら、開いたらそのまま進み続ける
  if(S.auto)startStage(stageOpen(S.cur)?S.cur:frontier(),{resume:true});
  window.__v3={GROW,get S(){return S;},get B(){return B;},startStage,simStage,compileBag,STAGES,save,renderAll,openChests,showChests,featureOpen};
}
queueMicrotask(boot);


// ---------- 宝箱・段階解放・案内 ----------
function lockHTML(){return '<i class="feature-lock" aria-label="鍵あり"></i>';}
function lockedFeature(k){feed(FEATURE_HINT[k],'#f5d59c');sfx('tick');}
function stageRoles(st){return [...new Set(stageFoes(st).map(k=>FOES[k].tr).filter(Boolean))].map(r=>TR_NM[r].split('：')[0]).join('・');}
function addChest(id,st,fx){S.chests.push({id,st});syncUnlocks();save(true);renderChestBar();chestFly(fx);}
function chestArt(open=false){return `<span class="chest-art ${open?'opened':''}" aria-hidden="true"><i class="chest-lid"></i><i class="chest-base"></i><i class="chest-clasp"></i></span>`;}
function chestFly(fx){feed('宝箱を手に入れた','#f6d698');if(reducedMotion())return;const r=$('stage').getBoundingClientRect(),target=document.querySelector('#tabs [data-t="adv"] .tab-orb').getBoundingClientRect(),el=document.createElement('div');el.className='chest-flight';el.innerHTML=chestArt();const x=r.left+r.width*clamp(fx,.1,.9)-23,y=r.top+r.height*.38;el.style.left=x+'px';el.style.top=y+'px';document.body.appendChild(el);const a=el.animate([{transform:'translateY(10px) scale(.6)',opacity:0},{transform:'translateY(-16px)',opacity:1,offset:.2},{transform:'translateY(-16px)',opacity:1,offset:.5},{transform:`translate(${target.left+target.width/2-x-23}px,${target.top+target.height/2-y-20}px) scale(.5)`,opacity:.7}],{duration:900,easing:'ease-out',fill:'forwards'});a.onfinish=()=>el.remove();}
function renderChestBar(){renderRewardQueue();const el=$('chestbar');if(!el)return;el.innerHTML=S.chests.length?`<button id="chestButton" class="chest-button">${chestArt()}<span>宝箱 ${S.chests.length}個<small>押して開ける</small></span></button>`:'';if($('chestButton'))$('chestButton').onclick=()=>showChests();const key=stashKeys('all').find(k=>S.newk[k]);if(!S.chests.length&&key){el.innerHTML=`<button class="chest-button" id="newItemButton">新しい品 ${ITEMS[key.split('|')[0]].nm}を比べる</button>`;$('newItemButton').onclick=()=>chooseItem(key);}}
function openChests(n=1){const result=S.chests.splice(0,n),fresh=result.map(it=>!S.seen[it.id]);for(const it of result)addStash(it.id,it.st,true);if(result.length)rewardBatch=rewardBatch.filter(it=>!it.placed);rewardBatch.push(...result.map((it,i)=>({...it,placed:false,fresh:fresh[i],rid:S.rewardSerial=(S.rewardSerial||0)+1})));if(result.length)persistRewards();if(result.length){S.tut.opened=true;syncUnlocks();tutorialTick();save(true);renderChestBar();if(!SEL)renderStash2();}return result;}
function renderRewardQueue(){const el=$('reward-queue');if(!el)return;const left=rewardBatch.filter(it=>!it.placed).length,editChest=isPhone()&&mobileEdit&&S.tab==='adv'&&S.chests.length;
  el.innerHTML=(editChest?`<button id="editChests">宝箱 ${S.chests.length}個を開ける</button>`:'')+(rewardBatch.length?`${editChest?'':`<span>${left?`前回の残り${left}品を比べて置ける`:'手に入れた品を配置した'}</span>`}<button id="rewardReview">${left?'残り'+left+'品を見る':'配置した品を見る'}</button><button id="rewardDismiss">閉じる</button>`:'');
  $('editChests')?.addEventListener('click',()=>showChests());$('rewardReview')?.addEventListener('click',()=>showChests());$('rewardDismiss')?.addEventListener('click',()=>{rewardBatch=rewardBatch.filter(it=>!it.placed);activeReward=null;persistRewards();renderRewardQueue();});}
function showChests(){const sorted=rewardBatch.slice().sort((a,b)=>b.st-a.st||+(b.fresh||false)-+(a.fresh||false));
  const actions=S.chests.length?`<button class="btn go" id="chestOne">1個開ける</button><button class="btn" id="chestAll">全部開ける</button>`:'';
  modal(`<div class="reward-heading"><h2>${sorted.length?'手に入れた品':'宝箱を開けよう'}</h2><button class="btn" data-x>閉じる</button></div>${sorted.length?`<div class="chest-reveal opened">${chestArt(true)}<b>効果を比べて、続けて置ける</b></div><div class="reward-list">${sorted.map((it,i)=>{const rec=placementFor(it.id+'|'+it.st),old=S.bags[rec.j][rec.slot],label=metricLabel(ITEMS[it.id].kind,ITEMS[it.id].sup);return `<article class="reward-item r${it.st}" data-placed="${it.placed}"><button class="reward-icon" data-reward="${i}" aria-label="${ITEMS[it.id].nm}を選ぶ" ${it.placed?'disabled':''}>${itemHTML(it)}</button><div><b style="color:var(--r${it.st})">${ITEMS[it.id].nm} ${STAR_NM[it.st]}</b>${it.fresh?'<span class="fresh-label">初めての品</span>':''}${it.placed?'<p>配置済み</p>':`<p>${JOBS[rec.j].nm}・${label} ${deltaLabel(rec.gain)}<br><small>${old?ITEMS[old.id].nm+' '+STAR_NM[old.st]+'と入れ替え':'空きマスに追加'}<br>${label} ${rec.base.toFixed(1)} から ${rec.value.toFixed(1)}${lostLabel(rec)?'<br>入れ替えで '+lostLabel(rec):''}</small></p>`}<button class="btn go" data-equip-reward="${i}" ${it.placed?'disabled':''}>${it.placed?'配置済み':'おすすめに置く'}</button></div></article>`;}).join('')}</div>`:`<div class="chest-reveal">${chestArt()}<p>${S.chests.length?'ふたを開けて中を見よう':'宝箱はない'}</p></div>`}<p class="sub">残りの宝箱 ${S.chests.length}個</p><div class="row">${actions}</div>`);
  const open=n=>{const r=openChests(n);if(r.length)sfx('rare');showChests();renderRewardQueue();};if($('chestOne'))$('chestOne').onclick=()=>open(1);if($('chestAll'))$('chestAll').onclick=()=>open(S.chests.length);
  $('mcard').querySelectorAll('[data-reward]').forEach(b=>b.onclick=()=>{const it=sorted[+b.dataset.reward];closeModal(true);activeReward=it;chooseItem(it.id+'|'+it.st);});
  $('mcard').querySelectorAll('[data-equip-reward]').forEach(b=>b.onclick=()=>{const it=sorted[+b.dataset.equipReward],key=it.id+'|'+it.st,rec=placementFor(key);closeModal(true);activeReward=it;setMobileEdit(true);S.tab='adv';setSel({from:'stash',key});renderAll();cellTap(rec.j,rec.slot);});
}

function firstGearAction(){const keys=stashKeys('all');const heal=keys.find(k=>ITEMS[k.split('|')[0]].kind==='heal'&&placementFor(k).net>.01);if(heal&&!S.party.some(j=>S.bags[j].some(it=>it&&ITEMS[it.id].kind==='heal')))return {key:heal,text:'薬を置こう。いちばん弱った仲間を回復できる'};
  const choices=keys.map(key=>{const r=placementFor(key),D=ITEMS[r.it.id];return {key,r,score:r.net+(D.sup==='pow'?5:0),text:ITEMS[r.it.id].nm+(D.kind==='sup'?'を武器の隣へ置こう':D.kind==='shield'?'を前衛に置いて守ろう':'を空きマスに置いて攻撃を増やそう')};}).filter(a=>a.r.net>.05);choices.sort((a,b)=>b.score-a.score);return choices[0]||null;
}
function renderFirstWall(el){const a=firstGearAction(),chest=S.chests.length;el.dataset.sig='';el.innerHTML=`<aside class="tutorial-note wall-preparation"><span><b>1-4へ進む前に準備しよう</b> 前衛を盾と薬で守り、短剣や砥石で攻撃を増やす。${SEL?'選んだ勇者の光ったマスに置こう。':a?a.text+'。':chest?'宝箱にまだ使える品がある。':'手持ちの準備ができた。次の戦闘で効き目を見よう。'}</span>${SEL?'':a?'<button id="tutPrepare">'+ITEMS[a.key.split('|')[0]].nm+'を比べる</button>':chest?'<button id="tutPrepare">宝箱を開ける</button>':'<button id="tutUnderstand">この装備で進む</button>'}${a||chest?'<button id="tutContinue">今の装備で進む</button>':''}</aside>`;
  const proceed=()=>{S.tut.preparing=false;S.tut.wallPrepared=true;if(B)B.preparing=false;setMobileEdit(false);save(true);renderAll();};if($('tutPrepare')){$('tutPrepare').onclick=()=>a?chooseItem(a.key):showChests();$('tutPrepare').classList.add('tutorial-target');}if($('tutUnderstand'))$('tutUnderstand').onclick=proceed;if($('tutContinue'))$('tutContinue').onclick=proceed;if(SEL){const rec=placementFor(SEL.key,SEL.job,!!SEL.job);document.querySelector(`#bag [data-job="${rec.j}"] .recommended`)?.classList.add('tutorial-target');}}

function tutorialTick(){if(!S||S.tut.off)return;syncUnlocks(true);const t=S.tut,old=t.step||0;if(!t.firstKey&&S.stash['dagger|1']>0)t.firstKey='dagger|1';let step=old;
  if(step===0&&(B||S.auto))step=1;
  if(step===1&&t.placed)step=2;
  if(step===2&&t.support)step=3;
  if(step===2&&S.tab==='stash'&&!Object.keys(S.stash).some(k=>S.stash[k]>0&&ITEMS[k.split('|')[0]].kind==='sup')&&!S.chests.length)step=5;
  if(step===3&&t.understood)step=4;
  if(step===4&&S.tab==='stash')step=5;
  if(step!==old){t.step=step;save(true);}renderTutorial();}
function renderTutorial(){document.querySelectorAll('.tutorial-target').forEach(el=>el.classList.remove('tutorial-target'));const el=$('tutorial');if(!el||!S)return;syncUnlocks(true);const t=S.tut;if(t.step>=4)S.unlocks.stash=true;if(t.preparing&&!t.off){renderFirstWall(el);return;}if(t.off||t.step>=5){el.innerHTML='';el.dataset.sig='';return;}let text='',target='';
  if(!t.step){text='出発を押すと、勇者が自動で進む';target='#hGo';}
  else if(t.step===1){if(S.stash[t.firstKey]>0){if(!mobileEdit&&isPhone()){text='手元の短剣を置くと攻撃が増える。鞄を編集しよう';target='#openBagEdit';}else{text=SEL?'光ったマスを押すと、すぐ攻撃が増える':'短剣を選んで、空きマスに置こう';target=SEL?'#bag .recommended':`#sgrid [data-k="${t.firstKey}"]`;}}else if(S.chests.length){text='宝箱を開けて、最初の品を見よう';target='#chestButton';}else{text='落とし物は鞄の編集画面へ届く。冒険は自動で進む';target='';}}
  else if(t.step===2){const a=firstGearAction();if(a?.key){if(!mobileEdit&&isPhone()){text=a.text+'。鞄を編集しよう';target='#openBagEdit';}else{text=SEL?'選んだ勇者の光ったマスへ置こう':a.text;target=SEL?`#bag [data-job="${placementFor(SEL.key,SEL.job,!!SEL.job).j}"] .recommended`:`#sgrid [data-k="${a.key}"]`;}}else if(S.chests.length){text='宝箱の品を取り出して、守りと攻撃を増やそう';target=mobileEdit?'#editChests':'#chestButton';}else{text='次の宝箱まで進もう。薬は弱った仲間を回復する';target='';}}
  else if(t.step===3){text='攻撃が増えた。溜めの輪と盾の膜を眺めよう。最初の強敵の前にもう一度準備できる';target='';}
  else{text='品は倉庫へ。宝箱は鞄の上から開けられる';target='#tabs [data-t="stash"]';}
  const sig=t.step+'|'+text;if(el.dataset.sig!==sig){el.dataset.sig=sig;el.innerHTML=`<aside class="tutorial-note"><span>${text}</span>${t.step===3?'<button id="tutUnderstand">分かった</button>':'<button id="tutOff">案内を消す</button>'}</aside>`;if($('tutOff'))$('tutOff').onclick=()=>{t.off=true;if(B?.preparing)B.preparing=false;t.preparing=false;save(true);renderTutorial();};if($('tutUnderstand'))$('tutUnderstand').onclick=()=>{S.tut.understood=true;setMobileEdit(false);tutorialTick();renderAll();};}const targets=target?document.querySelectorAll(target):[];targets.forEach(e=>e.classList.add('tutorial-target'));
  if(targets.length&&!modalOpen()&&el.dataset.target!==target){el.dataset.target=target;if($('main').contains(targets[0])&&S.tab!=='adv')targets[0].scrollIntoView({block:'nearest',behavior:'auto'});}
}
