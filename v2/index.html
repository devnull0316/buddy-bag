<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>王様の鞄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* 『王様の鞄』v2 試作：王国共用の鞄1つ・形のある道具・横帯の自動戦闘（設計 docs/v2-design.md） */
:root{--bg:#1b1511;--wood:#3a2a1e;--wood2:#2c2017;--edge:#140e0a;--leather:#7a5234;--leather-dk:#4f331f;--parch:#ead9b0;--ink:#2a1d10;--brass:#e0b04a;--text:#f0e6d6;--sub:#b9a78f;--f-dot:'DotGothic16',monospace;--f-ui:'Zen Kaku Gothic New',sans-serif;--cell:48px;--band:150px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--f-ui);overscroll-behavior:none;user-select:none;-webkit-user-select:none;font-variant-emoji:text}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:8px 10px;gap:7px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.btn{background:var(--wood);border:2px solid var(--edge);box-shadow:inset 0 -3px 0 #24180f,inset 0 2px 0 #5a4232;min-height:44px;padding:6px 12px;font-family:var(--f-dot);font-size:15px}
.btn.go{background:var(--brass);color:var(--ink);box-shadow:inset 0 -3px 0 #a87a22,inset 0 2px 0 #ffe08a}
.btn:disabled{opacity:.45}
#top{display:flex;align-items:center;gap:6px;font-family:var(--f-dot);font-size:15px;min-height:36px;flex:none}
#top .chip{background:var(--wood2);padding:4px 8px;border:1px solid var(--edge);white-space:nowrap}
#top .gold{color:var(--brass)}
#top .sp{flex:1}
#top .tb{background:var(--wood2);border:1px solid var(--edge);min-height:36px;min-width:44px;padding:2px 8px;font-family:var(--f-dot);font-size:14px}
#top .tb:disabled{opacity:.35}
/* 横帯（Task Bar Hero 型） */
#band{position:relative;height:var(--band);background:#2a2440;border:2px solid var(--edge);overflow:hidden;flex:none}
#band canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#foe{font-size:13px;color:var(--sub);min-height:18px;line-height:1.4;flex:none}
#foe b{color:var(--text)}#foe .pw{color:var(--brass)}
/* 鞄 */
#bagwrap{display:flex;justify-content:center;flex:none}
#bag{position:relative;background:var(--leather);border:3px solid var(--edge);box-shadow:inset 2px 2px 0 #9a6640,inset -2px -3px 0 var(--leather-dk);padding:6px}
#grid{position:relative;display:grid;gap:2px}
.cell{width:var(--cell);height:var(--cell);background:var(--leather-dk);box-shadow:inset 2px 2px 0 rgba(0,0,0,.35)}
.cell.can{background:#5c4a2a;box-shadow:inset 0 0 0 2px rgba(224,176,74,.45)}
.cell.hint{background:#6b5a2a;box-shadow:inset 0 0 0 3px var(--brass)}
.cell.ok{background:#4f7a3a}.cell.ng{background:#7a3a2e}.cell.mg{background:#3a5f8a}
.it{position:absolute;pointer-events:auto;touch-action:none}
.it .blk{position:absolute;background:rgba(240,220,170,.16);border:2px solid rgba(255,230,170,.55)}
.it.t2 .blk{border-color:#7fb8ff;background:rgba(127,184,255,.18)}.it.t3 .blk{border-color:#ffd34a;background:rgba(255,211,74,.2)}
.it.sel .blk{border-color:#fff;background:rgba(255,255,255,.22)}
.it.lnk .blk{border-color:var(--brass)}
.it.dim{opacity:.35}
.it img.ic{position:absolute;image-rendering:pixelated;pointer-events:none;filter:drop-shadow(1px 2px 0 rgba(0,0,0,.5))}
.it .tier{position:absolute;font:bold 12px/1 var(--f-dot);color:#fff;background:#2a1d10;border:1px solid #8a6a3a;padding:1px 3px;pointer-events:none}
.it .own{position:absolute;width:18px;height:18px;border-radius:50%;border:2px solid #fff;pointer-events:none;font:bold 11px/14px var(--f-dot);text-align:center;color:#fff}
.it.fire .blk{background:rgba(255,230,120,.55);border-color:#fff3b0}
.it .pop{position:absolute;left:50%;top:30%;transform:translate(-50%,0);font:bold 16px/1 var(--f-dot);pointer-events:none;text-shadow:1px 1px 0 #000,-1px 1px 0 #000,1px -1px 0 #000,-1px -1px 0 #000;animation:rise .8s ease-out forwards;z-index:3;white-space:nowrap}
@keyframes rise{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-26px)}}
#links{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;z-index:2}
#links line{stroke:var(--brass);stroke-width:3;stroke-linecap:round}
#links text{font:bold 13px var(--f-dot);fill:#fff;paint-order:stroke;stroke:#2a1d10;stroke-width:3px}
#ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:50;display:none;opacity:.85}
#ghost .blk{position:absolute;background:rgba(240,220,170,.3);border:2px solid #fff}
#ghost img{position:absolute;image-rendering:pixelated}
/* 手ほどき */
#tip{display:none;background:var(--parch);color:var(--ink);border:2px solid var(--ink);padding:6px 8px;font-size:13px;line-height:1.5;flex:none}
#tip b{font-family:var(--f-dot)}
.guide{outline:3px solid var(--brass)!important;outline-offset:1px}
/* 下：店と机 */
#shop{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:none}
.ware{background:var(--wood);border:2px solid var(--edge);min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;touch-action:none}
.ware img{width:32px;height:32px;image-rendering:pixelated;pointer-events:none}
.ware .wt{display:flex;flex-direction:column;align-items:center;pointer-events:none}.ware .nm{font-size:12px}.ware .pr{font:13px var(--f-dot);color:var(--brass)}.ware .pr.no{color:#c06050}
.ware.pick{outline:2px solid #fff}.ware.sold{opacity:.25}
#shop.sellzone .ware{border-color:var(--brass)}
#row{display:flex;gap:6px;flex:none}
#desk{flex:1;display:flex;gap:4px;background:var(--wood2);border:2px solid var(--edge);padding:3px;align-items:center}
#desk .dlab{font-size:12px;color:var(--sub);writing-mode:vertical-rl}
.dslot{width:44px;height:44px;background:var(--leather-dk);display:flex;align-items:center;justify-content:center;position:relative;touch-action:none}
.dslot img{width:32px;height:32px;image-rendering:pixelated;pointer-events:none}
.dslot .tier{position:absolute;right:1px;top:1px;font:bold 11px/1 var(--f-dot);background:#2a1d10;padding:1px 2px}
.dslot.sel{outline:2px solid #fff}.dslot.ok{outline:2px solid #6fbf4f}
#info{min-height:44px;font-size:13px;color:var(--sub);background:var(--wood2);border:1px solid var(--edge);padding:5px 8px;display:flex;gap:8px;align-items:center;flex:none}
#info b{color:var(--text)}#info .acts{margin-left:auto;display:flex;gap:4px}#info .acts .btn{min-height:40px;padding:4px 9px;font-size:14px;white-space:nowrap}
#info small{color:var(--brass)}
#modal{position:fixed;inset:0;background:rgba(10,7,5,.84);display:none;align-items:center;justify-content:center;padding:16px;z-index:40}
#modal .card{background:var(--wood);border:3px solid var(--edge);padding:16px;max-width:440px;width:100%;max-height:92vh;overflow:auto}
#modal h2{font-family:var(--f-dot);margin:0 0 8px}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.choice{background:var(--wood2);border:2px solid var(--edge);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:96px}
.choice img{width:40px;height:40px;image-rendering:pixelated}.choice small{font-size:12px;color:var(--sub);text-align:center}
.choice.route{min-height:120px;padding:10px 8px}.choice.route b{font-family:var(--f-dot);font-size:16px}.choice.route .gain{color:var(--brass);font-size:13px}
.say{display:flex;gap:10px;align-items:flex-start;margin:6px 0}
.say img{width:64px;height:64px;image-rendering:pixelated;border:2px solid var(--edge);background:var(--wood2);flex:none}
.say .who{font-family:var(--f-dot);color:var(--brass);font-size:14px}
.say p{margin:2px 0 0;font-size:15px;line-height:1.7}
.stat{background:var(--wood2);border:1px solid var(--edge);padding:6px 8px;margin:6px 0;font-size:13px;color:var(--sub);line-height:1.6}
.stat b{color:var(--text)}
#castleMap{width:100%;aspect-ratio:3/2;background:#2c2017 center/cover no-repeat;image-rendering:pixelated;border:2px solid var(--edge);margin:6px 0;position:relative}
#castleMap .pin{position:absolute;font:bold 12px var(--f-dot);background:var(--brass);color:var(--ink);padding:2px 5px;border:2px solid var(--ink);transform:translate(-50%,-50%);white-space:nowrap}
#castleMap .pin.off{background:#555;color:#ccc}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--parch);color:var(--ink);font-family:var(--f-dot);padding:6px 12px;border:2px solid var(--ink);display:none;z-index:45;white-space:nowrap}
.sub{color:var(--sub);font-size:13px}
/* iPad など広い画面：全体を大きく */
body.wide #app{max-width:640px;justify-content:center}
/* 背の低い画面：すき間と店を詰める */
body.short #app{gap:5px;padding:6px 8px}
body.short .ware{min-height:54px;flex-direction:row;gap:4px;padding:2px}body.short .ware img{width:26px;height:26px}body.short .ware .nm{font-size:11px}
body.short #row .btn{min-height:44px}
body.short #foe{font-size:12px}body.short #tip{font-size:12px;padding:4px 6px}
.credit{font-size:11px;color:#8a7a66;margin-top:10px}
</style></head><body>
<div id="app">
 <div id="top"><span class="chip" id="where">第1章</span><span class="chip" id="lives"></span><span class="sp"></span><button class="tb" id="bUndo">戻す</button><button class="tb" id="bSnd">音</button><span class="chip gold" id="gold">金 10</span></div>
 <div id="band"><canvas id="cv"></canvas></div>
 <div id="foe"></div>
 <div id="tip"></div>
 <div id="bagwrap"><div id="bag"><div id="grid"></div></div></div>
 <div id="info"></div>
 <div id="shop"></div>
 <div id="row"><div id="desk"></div><button class="btn" id="bRoll">回す<br>1金</button><button class="btn go" id="bGo">出発</button></div>
</div>
<div id="ghost"></div>
<div id="modal"><div class="card" id="mcard"></div></div>
<div id="toast"></div>
<script>
'use strict';
const A='../assets2/';const ICON=k=>A+'icons/'+k+'.png';
// ===== 道具（設計の表そのまま。形は [x,y] の並び） =====
const ITEMS={
 sword:{nm:'剣',shape:[[0,0],[0,1],[0,2]],kind:'atk',v:[8,12,18],cd:3,ic:'sword',own:1,txt:'3秒ごとに攻撃する'},
 bow:{nm:'弓',shape:[[0,0],[0,1],[1,1]],kind:'atk',v:[6,9,14],cd:2,ic:'bow',own:1,txt:'2秒ごとに攻撃する'},
 staff:{nm:'杖',shape:[[0,0],[0,1]],kind:'heal',v:[6,9,14],cd:4,ic:'staff',own:1,txt:'4秒ごとにHPを戻す'},
 dagger:{nm:'短剣',shape:[[0,0],[1,0]],kind:'atk',v:[4,6,9],cd:1,ic:'dagger',own:1,txt:'1秒ごとに小さく攻撃する'},
 spear:{nm:'槍',shape:[[0,0],[0,1],[0,2],[0,3]],kind:'atk',v:[18,27,41],cd:4,ic:'spear',own:1,txt:'4秒ごとに大きく攻撃する'},
 shield:{nm:'盾',shape:[[0,0],[1,0],[0,1],[1,1]],kind:'guard',v:[2],ic:'shield',txt:'受ける攻撃を2小さくする（3個まで）'},
 whet:{nm:'砥石',shape:[[0,0]],kind:'whet',v:[4],ic:'whet',txt:'となりの武器の攻撃＋4'},
 flag:{nm:'旗',shape:[[0,0],[1,0],[0,1],[1,1]],kind:'flag',v:[2],ic:'herald',txt:'ちがう武器2つ以上がとなりなら、その武器全部の攻撃×2'},
 bell:{nm:'鈴',shape:[[0,0],[1,0],[0,1]],kind:'bell',v:[1],ic:'echobell',txt:'となりの武器が1秒はやく動く（最短1秒）'},
 potion:{nm:'薬',shape:[[0,0]],kind:'potion',v:[25],ic:'potion',txt:'HPが半分以下になったら1回、HP＋25（2個まで）'},
};
const PRICE={sword:4,bow:4,staff:4,dagger:3,spear:6,shield:4,whet:3,flag:5,bell:4,potion:3};
const WEAPON=k=>ITEMS[k].kind==='atk';
const SUPPORT=k=>['whet','bell','flag'].includes(ITEMS[k].kind);
const canMerge=(k,t)=>ITEMS[k].v.length>1&&(t||1)<3;
const HEROES=[{id:'knight',nm:'アオ',job:'剣士',col:'#4f8fd8',likes:['sword'],sp:'knight'},{id:'archer',nm:'リン',job:'弓士',col:'#69b552',likes:['bow'],sp:'archer'},{id:'mage',nm:'ミナ',job:'僧侶',col:'#a070d0',likes:['staff'],sp:'mage'}];
const ownerFor=k=>Math.max(0,HEROES.findIndex(h=>h.likes.includes(k)));
const META={"knight":{"w":95,"h":71,"body":51,"anims":{"idle":11,"attack":7,"hit":3,"death":11}},"archer":{"w":66,"h":45,"body":36,"anims":{"idle":10,"attack":6,"hit":3,"death":10}},"mage":{"w":167,"h":136,"body":86,"anims":{"idle":6,"attack":8,"hit":4,"death":7}},"skeleton":{"w":98,"h":59,"body":51,"anims":{"idle":4,"attack":8,"hit":3,"death":4}},"goblin":{"w":88,"h":46,"body":36,"anims":{"idle":4,"attack":8,"hit":3,"death":4}},"slime":{"w":111,"h":35,"body":20,"anims":{"idle":14,"attack":19,"hit":3,"death":11}},"bat":{"w":72,"h":55,"body":55,"anims":{"idle":11,"attack":11,"hit":3,"death":4}},"rat":{"w":46,"h":22,"body":20,"anims":{"idle":10,"attack":12,"hit":3,"death":6}},"mushroom":{"w":71,"h":45,"body":37,"anims":{"idle":4,"attack":8,"hit":3,"death":4}}};
// ===== 第1章（国境の村）。2戦目と4戦目のあとに道を選ぶ。敵は列で来る：[種類,HP,攻撃,間隔,守り] =====
const ENC={
 r1:{nm:'ネズミの群れ',bg:'village',foes:[['rat',60,4,2,0],['rat',60,4,2,0]]},
 r2:{nm:'大きなキノコ',bg:'village',foes:[['mushroom',260,7,2.5,0]]},
 A3:{nm:'ゴブリンの見張り',bg:'forest',foes:[['goblin',220,8,2,0],['rat',120,4,1.5,0]]},
 A4:{nm:'ゴブリンの斥候',bg:'forest',foes:[['goblin',240,8,1.8,0],['goblin',240,8,1.8,0]]},
 B3:{nm:'スライムの沼',bg:'swamp',foes:[['slime',330,8,3,2],['slime',200,6,3,1]]},
 B4:{nm:'大きなスライム',bg:'swamp',foes:[['slime',620,12,3,3]]},
 A5:{nm:'コウモリの夜',bg:'tower',foes:[['bat',260,8,1.6,0],['bat',260,8,1.6,0],['rat',160,5,1.5,0]]},
 B5:{nm:'墓地の骨',bg:'grave',foes:[['skeleton',500,11,2.2,3],['rat',160,5,1.5,0]]},
 boss:{nm:'骸骨の隊長',bg:'grave',boss:1,foes:[['skeleton',1300,11,2.5,3]],big:{every:8,dmg:34,nm:'大振り'}},
};
// 道は「金の道」と「道具の道」の二択（Slay the Spire の分かれ道）
const ROUTES={2:[{k:'A',nm:'森の小道',gain:'勝つたびに金＋3',ds:'ゴブリンが出る。'},{k:'B',nm:'沼の近道',gain:'報酬の道具が段階2',ds:'スライムが出る。守り1〜2で硬い。'}],
 4:[{k:'A',nm:'見張り塔',gain:'勝つと金＋5',ds:'コウモリ3匹。攻撃が速い。'},{k:'B',nm:'墓地',gain:'報酬の道具が段階2',ds:'骨の兵。守り3で硬い。'}]};
const encOf=r=>r===0?ENC.r1:r===1?ENC.r2:r===5?ENC.boss:ENC[(r<=3?(S.route[2]||'A'):(S.route[4]||'A'))+(r+1)];
const routeOf=r=>r>=2&&r<=3?S.route[2]:r===4?S.route[4]:null;
// ===== 状態 =====
const COLS=6,ROWS=5,LIVES=3;
const fresh=()=>({route:{},gold:10,hp:120,max:120,round:0,lives:LIVES,items:[],desk:[null,null,null],shop:[],pick:null,sel:null,deskPick:null,rot:0,phase:'plan',tut:0,fights:0});
let S=fresh();
let uid=1,undo=[];
const shapeOf=(k,rot)=>{let s=ITEMS[k].shape.map(p=>[...p]);for(let r=0;r<(rot||0)%4;r++)s=s.map(([x,y])=>[-y,x]);const mx=Math.min(...s.map(p=>p[0])),my=Math.min(...s.map(p=>p[1]));return s.map(([x,y])=>[x-mx,y-my]).sort((a,b)=>a[1]-b[1]||a[0]-b[0]);};
// 指で持つマスは形の真ん中のマス
const grabOf=(k,rot)=>{const s=shapeOf(k,rot);return s[Math.floor((s.length-1)/2)];};
const cellsOf=it=>shapeOf(it.k,it.rot).map(([x,y])=>[it.x+x,it.y+y]);
function fits(k,rot,x,y,ignore){const cs=shapeOf(k,rot).map(([a,b])=>[x+a,y+b]);if(cs.some(([a,b])=>a<0||b<0||a>=COLS||b>=ROWS))return false;const occ=new Set();for(const it of S.items)if(it!==ignore)for(const c of cellsOf(it))occ.add(c+'');return !cs.some(c=>occ.has(c+''));}
function touching(a,b){const ca=cellsOf(a),cb=new Set(cellsOf(b).map(c=>c+''));return ca.some(([x,y])=>[[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>cb.has([x+dx,y+dy]+'')));}
const itemAt=(x,y,ignore)=>S.items.find(it=>it!==ignore&&cellsOf(it).some(p=>p[0]===x&&p[1]===y));
// ===== 強さの計算（戦闘の始めに1回） =====
function stats(it){const d=ITEMS[it.k],tier=it.t||1,base=d.v[Math.min(tier,d.v.length)-1];if(!WEAPON(it.k)&&d.kind!=='heal')return null;
 let atk=base,cd=d.cd,why=[];const owner=HEROES[it.o??0];
 if(owner.likes.includes(it.k)){atk+=2;why.push(owner.nm+'の得意＋2');}
 if(d.kind==='atk'){const nb=S.items.filter(o=>o!==it&&touching(it,o));
  const wh=nb.filter(o=>o.k==='whet').slice(0,2);if(wh.length){atk+=4*wh.length;why.push('砥石＋'+4*wh.length);}
  const bl=nb.find(o=>o.k==='bell');if(bl){cd=Math.max(1,cd-1);why.push('鈴で1秒はやく');}
  const fl=nb.find(o=>o.k==='flag'&&flagOn(o));if(fl){atk*=2;why.push('旗×2');}}
 return {atk,cd,why};}
const flagOn=f=>new Set(S.items.filter(w=>WEAPON(w.k)&&touching(w,f)).map(w=>w.k)).size>=2;
const guardOf=()=>Math.min(3,S.items.filter(i=>i.k==='shield').length)*2;
// となりで効き合う相手（線で結ぶ）
function linksOf(it){const out=[];const nb=S.items.filter(o=>o!==it&&touching(it,o));
 if(WEAPON(it.k)){for(const o of nb){if(o.k==='whet')out.push([o,'+4']);else if(o.k==='bell')out.push([o,'−1秒']);else if(o.k==='flag'&&flagOn(o))out.push([o,'×2']);}}
 else if(it.k==='whet'||it.k==='bell'){for(const o of nb)if(WEAPON(o.k))out.push([o,it.k==='whet'?'+4':'−1秒']);}
 else if(it.k==='flag'){if(flagOn(it))for(const o of nb)if(WEAPON(o.k))out.push([o,'×2']);}
 return out;}
function power(arm){let dps=0,hps=0;for(const it of S.items){const st=stats(it);if(!st)continue;if(ITEMS[it.k].kind==='heal')hps+=st.atk/st.cd;else dps+=Math.max(1,st.atk-arm)/st.cd;}return {dps,hps};}
// ===== 音（Web Audio で合成。離れて戻ったら起こし直す） =====
let AC=null,MG=null,SND=true;try{SND=localStorage.getItem('oukaban.snd')!=='0';}catch(e){}
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.5;MG.connect(AC.destination);}catch(e){return null;}}if(AC.state!=='running')AC.resume().catch(()=>{});return AC;}

function tone(f,d,type,vol,to,dl){const a=AC;if(!a||!SND||a.state!=='running')return;const t=a.currentTime+(dl||0),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.03);}

const PT={'王様':'king','アオ':'knight','リン':'archer','ミナ':'mage'};
const STORY={
 intro:[['王様','国境の村が魔物に襲われた。骸骨の隊長が、村の墓地から兵を起こしているらしい。'],['アオ','おまかせを！ …でも、荷物はどうしましょう。'],['王様','鞄の中身は、わしが詰める。並べ方しだいで、道具は何倍にも働くぞ。']],
 boss:[['リン','いました、骸骨の隊長です！ ときどき大きく振りかぶってきます。'],['ミナ','大振りは盾で軽くできます。回復も切らさないように。']],
 clear:[['リン','村を取り戻しました！ 王様の詰めた鞄のおかげです。'],['王様','ようやった。だが隊長は「森の奥の方に伝えろ」と言い残したそうだな。'],['アオ','森の向こうに、まだ何かいる…。次の鞄も、お願いします。']]};
function scene(lines,then,i=0){const [who,txt]=lines[i];$('mcard').innerHTML=`<div class="say"><img src="${A}portraits/${PT[who]||'king'}.png" alt=""><div><div class="who">${who}</div><p>${txt}</p></div></div><button class="btn go" id="scOk" style="width:100%;margin-top:8px">${i<lines.length-1?'つぎへ':'つづける'}</button>`;$('modal').style.display='flex';
 $('scOk').onclick=()=>{sfx('tick');if(i<lines.length-1)scene(lines,then,i+1);else{$('modal').style.display='none';render();then&&then();}};}
function showCastle(){const pg=loadProg(),has=load();S.phase='castle';
 $('mcard').innerHTML=`<h2>王の玉座</h2><p class="sub">勇者たちの鞄を詰めて、魔王を倒そう。</p>
 <div id="castleMap" style="background-image:url(${A}map/kingdom.png)"><span class="pin" style="left:26%;top:74%">第1章 国境の村${pg.c1?'（済）':''}</span><span class="pin off" style="left:48%;top:42%">第2章 北の森</span><span class="pin off" style="left:76%;top:16%">魔王城</span></div>
 <div class="stat"><b>第1章 国境の村</b>　6戦・最後に骸骨の隊長。命は${LIVES}つ。${pg.c1?`<br>クリア ${pg.c1}回`:''}</div>
 <p class="sub">第2章 北の森：準備中</p>
 ${has?`<button class="btn" id="cCont" style="width:100%;margin-bottom:6px">続きから（${S.round+1}戦目・命${S.lives}）</button>`:''}
 <button class="btn go" id="cGo" style="width:100%">${has?'はじめから出発':'第1章へ出発'}</button>
 <p class="credit">アイコン：Shikashi's Fantasy Icons Pack（CC BY 4.0）／キャラ：LuizMelo</p>`;$('modal').style.display='flex';
 if($('cCont'))$('cCont').onclick=()=>{$('modal').style.display='none';S.phase='plan';rollShopIfEmpty();render();};
 $('cGo').onclick=()=>{$('modal').style.display='none';clearSave();newRun();S.started=true;if(!pg.tut){S.tut=1;S.shop=['whet','shield','dagger','potion'];pg.tut=1;saveProg(pg);}save();render();scene(STORY.intro);};}
function rollShopIfEmpty(){if(!S.shop||!S.shop.length)rollShop();}
function newRun(){undo=[];S=fresh();
 // 最初の持ち物：剣（アオ）・弓（リン）・杖（ミナ）
 S.items.push({id:uid++,k:'sword',x:0,y:1,rot:0,t:1,o:0},{id:uid++,k:'bow',x:2,y:1,rot:0,t:1,o:1},{id:uid++,k:'staff',x:5,y:0,rot:0,t:1,o:2});rollShop();render();}
addEventListener('resize',()=>{if(S.phase!=='castle')render();});
newRun();showCastle();requestAnimationFrame(function idle(){if(!B)draw();requestAnimationFrame(idle);});
</script></body></html>
